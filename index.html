  :root{
    /* brand — sampled from the Fortience Consulting logo: #2b245d wordmark, #7d7d7d subtitle */
    --brand:#2b245d; --brand-hover:#1e1943; --brand-soft:#eeedf7; --brand-line:#d6d3e9;
    --ink:#171a27; --ink-soft:#434a61; --muted:#767e95; --faint:#9ba3b8;
    --line:#e7e9f1; --line-soft:#f1f3f8; --bg:#fafbfd; --card:#ffffff;
    --accent:#0e7c5a; --accent-soft:#e6f4ee; --accent-line:#c4e3d6;
    --red:#b42318; --red-soft:#fef3f2; --amber:#a16207; --amber-soft:#fff8e8;
    --blue:#2563eb; --blue-soft:#eff5ff; --gray-soft:#f1f3f8;
    --radius:12px;
    --shadow:0 1px 2px rgba(23,26,39,.05), 0 1px 3px rgba(23,26,39,.04);
    --shadow-lift:0 1px 2px rgba(23,26,39,.06), 0 4px 12px rgba(23,26,39,.06);
    --sans:"IBM Plex Sans Thai","Segoe UI",-apple-system,BlinkMacSystemFont,"Sarabun","Noto Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.6;font-size:15px}
  /* Top bar, not a left rail: the upload controls are a one-time setup step, so they sit across the
     top and hand the full width to the content underneath rather than competing with it. */
  .app{min-height:100vh;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;box-shadow:var(--shadow)}
  .topbar-controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;flex:1}
  .ctl{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .ctl-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700;white-space:nowrap}
  /* One row (layout A, owner's pick 2026-09-25): file, then a thin divider, then the UC picker. Labels
     are plain Thai — uppercase + letter-spacing split Thai glyphs apart ("เลือก USE CASE"). The file
     input is capped so a long filename (the browser prints it beside the button) cannot push the
     picker onto a second line by chance; below 1100px there is not room for both, so the picker gets
     its own row on purpose — full width with a rule above, never an accidental wrap. :not(:empty)
     keeps a single-UC file (renderPicker() leaves #uc-picker empty) free of a stray divider. */
  .ctl-label,#uc-picker .side-label{font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:600;white-space:nowrap}
  #jsonFile,#jsonFilesMulti{max-width:260px}
  #uc-picker{display:flex;align-items:center;gap:9px}
  #uc-picker:not(:empty){margin-left:9px;padding-left:18px;border-left:1px solid var(--line)}
  #uc-picker .side-label{margin:0}
  @media(max-width:1100px){#uc-picker:not(:empty){flex-basis:100%;margin:9px 0 0;padding:9px 0 0;border-left:0;border-top:1px solid var(--line-soft)}}
  /* …and between phone and 1100px the file group stays beside the mode switch (without this the full-width
     picker row dragged the whole group onto its own line: three rows, the mode switch alone on top) */
  @media(min-width:761px) and (max-width:1100px){.topbar-controls{flex-wrap:nowrap}}
  .topbar select{width:auto;min-width:220px;max-width:380px;padding:7px 10px}
  /* a select sizes itself to its longest option, so a 35-character UC name pushed the page 22px past a
     375px screen. A percentage width drops its min-content to zero, so the row no longer widens to fit
     it; flex then gives it what is left beside the label, up to the same 330px cap */
  @media(max-width:760px){#uc-picker select{flex:1 1 auto;width:100%;min-width:0;max-width:330px}}
  .main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:30px 32px 10px}
  .pagefoot{max-width:1160px;margin:0 auto;width:100%;padding:18px 32px 34px;color:var(--faint);font-size:12px;border-top:1px solid var(--line);text-align:center}
  .brand{flex-shrink:0;line-height:0}
  .brand-logo{display:block;width:150px;height:auto}

  h1{font-size:27px;font-weight:700;letter-spacing:-.025em;margin:0 0 5px;line-height:1.22}
  h2{font-size:15.5px;font-weight:700;letter-spacing:-.005em;margin:32px 0 13px;color:var(--ink);display:flex;align-items:center;gap:9px}
  h3{font-size:14px;font-weight:650;margin:18px 0 8px;color:var(--ink-soft)}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .side-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:22px 0 8px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px 21px;margin-bottom:13px;box-shadow:var(--shadow)}
  /* The page does two different jobs and used to run them together as one scroll: what the workshop
     recorded about the Use Case, and what this tool can show from it. A divider alone did not say
     where one ended and the other began — which matters most in a screenshot a facilitator sends on,
     where a simulated Output can end up looking like part of the workshop's own record. Each job is
     a labelled frame now. The body sits on the page background so the white cards inside still read
     as raised rather than as a box inside a box. */
  .ucsec{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);margin:0 0 22px;overflow:hidden}
  .ucsec-head{display:flex;align-items:center;gap:11px;padding:13px 21px;background:var(--brand-soft);border-bottom:1px solid var(--brand-line)}
  .ucsec-head .n{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brand);background:var(--card);border:1px solid var(--brand-line);border-radius:20px;padding:3px 10px;white-space:nowrap}
  .ucsec-head .t{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--brand)}
  .ucsec-head .d{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
  .ucsec-body{padding:19px 21px 7px;background:var(--bg)}
  /* The three parts are three kinds of thing, so each gets its own container (option A, owner's pick
     2026-09-25): 1 = a record — plain white, a navy rule on the left · 2 = the workspace — solid green
     head, thick green frame, raised · 3 = the close — solid navy with the note as its lead line.
     Amber stays reserved for the mock-up warning. */
  #ucDetails{box-shadow:none}
  #ucDetails .ucsec-head{background:var(--card);border-left:5px solid var(--brand);border-bottom-color:var(--line)}
  #ucDetails .ucsec-body{background:var(--card)}
  .ucsec-alt{border:2px solid var(--accent);box-shadow:0 6px 22px rgba(14,124,90,.14)}
  .ucsec-alt .ucsec-head{background:var(--accent);border-bottom:none}
  .ucsec-alt .ucsec-head .t,.ucsec-alt .ucsec-head .d{color:#fff}
  .ucsec-alt .ucsec-head .n{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45);color:#fff}
  .ucsec-alt .ucsec-body{background:#f4faf7}
  /* the first heading in a section body has the head band above it already — no extra top gap */
  .ucsec-body>h2:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}.topbar{padding:11px 18px;gap:14px}.main{padding:22px 18px 8px}.pagefoot{padding:16px 18px 28px}
    .ucsec-head{padding:11px 15px;flex-wrap:wrap;gap:9px}.ucsec-head .d{margin-left:0;flex-basis:100%;text-align:left}.ucsec-body{padding:15px 15px 5px}}
  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;font-weight:600;letter-spacing:.01em}
  .tag-ink{background:var(--gray-soft);color:var(--ink-soft)}
  .box{border-radius:8px;padding:12px 14px;font-size:14px}
  .box-red{background:var(--red-soft);border:1px solid #f2d5d2}
  .box-green{background:var(--accent-soft);border:1px solid var(--accent-line)}
  .box-blue{background:var(--blue-soft);border:1px solid #cfe0f2}
  .box-amber{background:var(--amber-soft);border:1px solid #eddcb8}
  .box-gray{background:var(--gray-soft);border:1px solid var(--line)}
  .box h4{margin:0 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
  .box-red h4{color:var(--red)} .box-green h4{color:var(--accent)} .box-blue h4{color:var(--blue)} .box-amber h4{color:var(--amber)}
  /* Native file inputs default to the browser's own "Choose File" button, which clashed with the
     branded buttons everywhere else on the page. ::file-selector-button (and the older -webkit-
     prefixed equivalent, for wider engine coverage) restyles just the button half to match the
     app's base `button` rule below; the "No file chosen" text stays native since browsers do not
     expose it as stylable content, but its colour now follows the page's muted-text token instead
     of browser default black. The element, its id, accept=, multiple and onchange are all untouched
     — this is a paint-only change, so every existing wiring (dropzone routing, upload validation,
     [P5-2]'s accept= assertions) still holds. */
  input[type=file]{font-size:13px;margin:0;color:var(--muted)}
  input[type=file]::file-selector-button,input[type=file]::-webkit-file-upload-button{
    font-family:var(--sans);cursor:pointer;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:8px 14px;font-size:13px;font-weight:650;
    margin-right:10px;transition:.14s;box-shadow:var(--shadow)}
  input[type=file]:hover::file-selector-button,input[type=file]:hover::-webkit-file-upload-button{
    border-color:var(--brand-line);background:var(--brand-soft)}
  select,input[type=text]{font-family:var(--sans);font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff;color:var(--ink)}
  select:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

  /* Desktop keeps the two-row horizontal grid the workshop reads across. Below 760px that grid is
     about 2,130px wide (8 steps on 60 of the 69 fixture UC) against a 375px screen — roughly six
     screens of sideways scrolling — so the same cells stack instead. The emit order is already
     as-is, to-be, arrow per step, so switching grid-auto-flow to row gives a vertical stepper with
     each pair kept together; no second markup path to keep in step with the first. */

  .flowctl button{font-size:12.5px;padding:6px 12px;font-weight:600}

  .flownav-group{display:none;gap:8px;align-items:center;flex-wrap:wrap}

  .hflow-wrap{overflow-x:auto;padding-bottom:6px}
  /* Two real grid rows, not a row of independent columns: every as-is cell shares one row height and
     every to-be cell shares another, so the divide between "ปัจจุบัน" and "To-be" is one straight line
     across the whole diagram. Sizing each column to its own content (the previous flex layout) left
     the blocks starting at five different heights once the text wrapped. */

  .harrow{grid-row:1 / -1;color:var(--faint);font-size:16px;padding:0 7px;display:flex;align-items:center}

  .pf-tb .uc{color:var(--brand);font-weight:600;text-decoration:none} .pf-tb .uc:hover{text-decoration:underline}
  .pf-tb .flag{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:10px;padding:1px 7px;white-space:nowrap}
  .pf-tb .tk{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:0 6px;border:1px solid;white-space:nowrap}
  .pf-tb .tk.tA{color:var(--tA);border-color:var(--accent-line);background:#eef7f1} .pf-tb .tk.tB{color:#8a5a12;border-color:#eddcb8;background:#fdf6ec}
  .pf-tb .tk.tC{color:var(--tC);border-color:#cfe0f2;background:#f1f5fd} .pf-tb .tk.tD{color:#6b5494;border-color:#ddd3ee;background:#f5f2fa}
  .pf-tb .na{font-size:11.5px;color:var(--faint);font-style:italic}
  .pf-vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pf-vf .vi{background:var(--gray-soft);border-radius:8px;padding:10px 12px;font-size:13px}
  .pf-vf ul{margin:4px 0 0;padding-left:18px}
  .pf-fold>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:16px 1fr;column-gap:6px;align-items:baseline}
  .pf-fold>summary::-webkit-details-marker{display:none}
  .pf-fold>summary::before{content:"▸";grid-row:1/3;color:var(--brand);font-size:13px;transition:transform .15s}
  .pf-fold[open]>summary::before{transform:rotate(90deg)}
  .pf-fold .ft{font-size:14px;font-weight:650;color:var(--ink-soft)} .pf-fold .fs{font-size:12px;color:var(--muted)}
  .pf-fold-body{margin-top:12px}
  .pf-more{margin-top:10px} .pf-more summary{font-size:13px;color:var(--brand);cursor:pointer;font-weight:600;margin-bottom:10px}
  @media(max-width:760px){.pf-tiles{grid-template-columns:1fr 1fr}.pf-ov,.pf-vf{grid-template-columns:1fr}.qc .qm{display:none}}
  .exportbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
  .exportbar span{margin-right:4px}
  .printhead{display:none}
  /* Export PDF = this sheet + the browser's "Save as PDF". Sections 1 and 2 only (owner's call): no
     section 3, no controls, no upload route. The provenance banner is part of the output and stays. */
  @media print{
    @page{margin:14mm 12mm}
    body{background:#fff}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .topbar,#jsonCheck,.pagefoot,.divider,#confirmBar,#ucScope,.route,.need,.pickrow,#pick0,.flowctl,.exportbar,.pf-filter,.pf-tabs,input,select,button{display:none!important}
    .printhead{display:block;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
    .main{padding:0;max-width:none}
    .ucsec{box-shadow:none}
    /* nothing may hide off the side of a page: scrolling boxes open up, the flow diagram stacks */
    .tscroll,.hflow-wrap{overflow:visible!important}
    .hflow{grid-auto-flow:row;grid-template-rows:none;min-width:0}
    .hblock-asis,.hblock-tobe{width:auto}
    .harrow{grid-row:auto;justify-content:center;padding:3px 0;transform:rotate(90deg)}
    .hflow.step-mode>[data-step]{display:block!important}
    .hflow.step-mode .harrow{display:flex!important}
    tr,.card,.box,.hblock-asis,.hblock-tobe{break-inside:avoid}
    h1,h2,h3,h4{break-after:avoid}
  }
</style>

/* ============ FILE PARSING HELPERS (deterministic, client-side) ============ */
function parseCSV(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim().length);
  if(!lines.length) return {cols:[],rows:[]};
  const split=l=>{const out=[];let cur="",q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===","&&!q){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  const cols=split(lines[0]);
  // Count rows whose field count does not match the header. Reading behaviour is unchanged on purpose:
  // a short row is still padded with "" and a long row still has its extra fields dropped, because
  // repairing the file would be guessing on the user's behalf, which this product does not do. What was
  // missing is that both happened in silence — a file whose columns have shifted read exactly like a
  // clean one, and every number computed after that was wrong with nothing on screen to say so.
  let short=0,long=0;
  const rows=lines.slice(1).map(l=>{
    const c=split(l);
    if(c.length<cols.length) short++; else if(c.length>cols.length) long++;
    const o={};cols.forEach((k,i)=>o[k]=c[i]||"");return o});
  return {cols,rows,short,long};
}
// Generic date/period shapes — these are data FORMATS, not domain vocabulary, so rule 4 still holds.
// Years are compared as plain numbers, so Buddhist and Gregorian both work without converting calendars.
const DATE_SHAPES=[
  [/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/, m=>m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0")],
  [/^(\d{4})[-/](\d{1,2})$/,              m=>m[1]+"-"+m[2].padStart(2,"0")+"-01"],
  [/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/, m=>m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")],
  [/^(\d{4})$/,                           m=>m[1]+"-01-01"]
];
function dateKey(v){
  const s=String(v==null?"":v).trim();
  for(const [re,to] of DATE_SHAPES){ const m=re.exec(s); if(m) return to(m); }
  return null;
}
// Columns where nearly every filled value has a date shape — the candidates for "is this file in time order".
function listTimeColumns(cols,rows){
  return cols.filter(c=>{
    const vals=rows.map(r=>String(r[c]==null?"":r[c]).trim()).filter(v=>v!=="");
    if(vals.length<rows.length*0.9||vals.length<2) return false;
    return vals.filter(dateKey).length/vals.length>=0.9;
  });
}
// Ascending OR descending both count as ordered: a newest-first export is still in time order, and the
// evidence for which way customers export more often does not exist, so guessing would warn wrongly.
function rowsFollowTime(rows,col){
  const keys=rows.map(r=>dateKey(r[col])).filter(Boolean);
  if(keys.length<2) return true;
  let up=true,down=true;
  for(let i=1;i<keys.length;i++){ if(keys[i]<keys[i-1]) up=false; if(keys[i]>keys[i-1]) down=false; }
  return up||down;
}
function paragraphs(text){
  let p=text.replace(/\r/g,"").split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(p.length<2) p=text.split("\n").map(s=>s.trim()).filter(Boolean);
  return p;
}
// generic keyword extraction — NO domain vocabulary. numbers + ALL-CAPS acronyms + long tokens
function keywords(text){
  const kw=new Set();
  (text.match(/\b[A-Z]{2,6}\b/g)||[]).forEach(m=>kw.add(m));
  (text.match(/\b\d[\d.,/-]{1,}\b/g)||[]).forEach(m=>kw.add(m.replace(/[.,]$/,"")));
  return kw;
}
// generic n-gram overlap (works any language incl. Thai) — replaces difflib
function ngramSet(s,n=5){const g=new Set();for(let i=0;i+n<=s.length;i++)g.add(s.substr(i,n));return g}
// FULL overlap — every shared fragment, nothing dropped. This is the COUNTING half.
function ngramOverlap(a,b,n=5){
  const ga=ngramSet(a,n),gb=ngramSet(b,n),hits=[];
  ga.forEach(g=>{if(gb.has(g))hits.push(g)});
  return hits;
}
// DISPLAY half — a couple of fragments to show as evidence next to a match. Unchanged behaviour.
// These two used to be one function, and the capped display list was also what produced the score:
// a pair sharing 39 fragments and a pair sharing 3 both collapsed to 2, every pair tied on points,
// and the ranking degenerated into iteration order. Measured on a 10-pair corpus with a declared
// answer key: 4/10 correct before the split, 10/10 after — identically in Thai and in English, so
// the cap was the cause, not the language.
function sharedNgrams(a,b,n=5,max=2){
  // merge overlapping grams into phrases roughly by uniqueness
  return [...new Set(ngramOverlap(a,b,n))].sort((x,y)=>y.length-x.length).slice(0,max);
}
// Rarity weights built from the user's OWN uploaded candidates — no dictionary, no domain vocabulary,
// no language assumption (rule 4). A fragment present in every candidate ("ประกาศ", "notice") carries
// almost no information and scores near zero; one present in a single candidate carries all of it.
function rarityIndex(candidates,n=5){
  const gram=Object.create(null),kw=Object.create(null);
  candidates.forEach(c=>{
    ngramSet(String(c==null?"":c).toLowerCase(),n).forEach(g=>{gram[g]=(gram[g]||0)+1});
    keywords(String(c==null?"":c)).forEach(k=>{kw[k]=(kw[k]||0)+1});
  });
  return {gram,kw};
}
// How related are these two texts, weighted by how rare the shared parts are within this corpus.
function relatedness(a,b,idx,n=5){
  const A=String(a==null?"":a),B=String(b==null?"":b);
  let score=0;
  ngramOverlap(A.toLowerCase(),B.toLowerCase(),n).forEach(g=>{score+=1/((idx.gram[g])||1)});
  const bk=keywords(B);
  keywords(A).forEach(k=>{if(bk.has(k))score+=1/((idx.kw[k])||1)});
  return score;
}
// NOT DONE ON PURPOSE: a "confidence" gate that hides a best match when it barely beats its runner-up.
// Measured against a declared answer key plus a hand-checked real pair, the two populations overlap
// completely — correct matches ran as low as 1.01x and 2.47x their runner-up, while rows with no
// counterpart at all in the document set ran 1.41x, 1.69x, 1.75x, 2.42x. Every threshold tried
// discarded 1-3 correct matches and removed no wrong one. Unrelated files are already excluded by the
// score>0 filter (verified: two files about unrelated subjects produce no links at all). What the
// renderer reports instead is coverage — how many rows found any counterpart — which is a fact rather
// than a guess about certainty.
function guessCol(cols,cands){for(const c of cols){const cl=c.toLowerCase();if(cands.some(x=>cl.includes(x)))return c}return null}
// drop matched terms that are substrings of a longer matched term (removes noisy ngram fragments)
function dedupMatches(arr){
  const u=[...new Set(arr.filter(Boolean))].sort((a,b)=>b.length-a.length);
  const keep=[];
  for(const m of u){ if(!keep.some(k=>k.toLowerCase().includes(m.toLowerCase()))) keep.push(m); }
  return keep;
}
// Where a row and the paragraph it was linked to share text, as [start,end) spans of the PARAGRAPH, for
// highlighting. Every shared 5-gram is laid on the paragraph and overlapping ones are merged into the
// run they belong to — shown as separate grams, "ถังบำบัดน้ำเสีย" came out as "ถังบำ" "ังบำบ". Shared
// keywords (numbers, acronyms) too short for a 5-gram are added where they stand as whole tokens.
function sharedSpans(rowText, para, n=5){
  const g=ngramSet(String(rowText||"").toLowerCase(),n), pl=String(para||"").toLowerCase(), raw=[];
  for(let i=0;i+n<=pl.length;i++){ const s=pl.substr(i,n); if(g.has(s) && /\S/.test(s)) raw.push([i,i+n]); }
  const pk=keywords(para); keywords(rowText).forEach(k=>{ if(!pk.has(k)) return; const p=idPosition(k,para); if(p>=0) raw.push([p,p+k.length]); });
  raw.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  raw.forEach(s=>{ const last=merged[merged.length-1]; if(last && s[0]<=last[1]) last[1]=Math.max(last[1],s[1]); else merged.push([s[0],s[1]]); });
  // a run that starts or ends on a space or punctuation is highlighted without it
  const edge=/[\s,.:;()\[\]"'\-–—]/;
  return merged.map(([a,b])=>{ while(a<b && edge.test(para[a])) a++; while(b>a && edge.test(para[b-1])) b--; return [a,b]; }).filter(([a,b])=>b-a>=2);
}

/* ============ DETERMINISTIC RENDERERS from uploaded files ============ */
// Every column that could serve as a grouping column: low cardinality, and NOT an ID-like column
// (skip columns where nearly every value is unique — those are identifiers, not groups). Ordered best
// first by the rule that used to decide alone, so [0] is exactly what findCategoricalColumn() returned
// before; the rest of the list is what the user may now pick instead. The auto-pick rule is "fewest
// distinct values wins", which reliably surfaces the least interesting column in the file: on a
// 200-row fixture designed so that `status` has one group holding 93%, it chose `owner` (38/32/31) and
// the skew never reached the screen at all.
//
// The default is no longer "fewest distinct values wins". Measured on twelve chatbot answers to this
// tool's own prompts plus the test files, that rule chose a Yes/No flag over the use case's own
// classification almost every time — Hazardous_Flag over ABC_Class, Reviewed_By_Human over
// Breakdown_Category — because a flag has two values and nothing has fewer. Three mechanical rules
// replace it, none of which needs to know what a word means (rule 4):
//   1. a column of numbers is not a grouping — 1/2/3 meetings are a count to summarise, not three
//      groups, and grouping by it produced "the largest group is 1 (11 rows)"
//   2. a column with three or more values comes before a two-valued one — a two-valued column is
//      usually a flag on the rows, not the way the use case divides them
//   3. otherwise file order, which is also where buildPrompt() tells the chatbot to put the main
//      category column, so a simulated file lands on the column it was asked to lead with
// On those files this picked the use case's own classification in 5 of 5 classify/agent answers where
// the old rule picked a flag, and on the test files it surfaced the 93% skew in F3 and the mixed-case
// values in F4 that the old default hid. The picker still offers every candidate.
function listCategoricalColumns(cols, rows) {
  const n = rows.length, multi = [], two = [];
  for (const c of cols) {
    const vals = rows.map(r => r[c]).filter(v => v !== "");
    if (vals.length < n * 0.6) continue;
    const trimmed = vals.map(v => String(v).trim()).filter(v => v !== "");
    if (trimmed.length && trimmed.filter(v => !isNaN(Number(v))).length / trimmed.length >= 0.9) continue;
    const uniq = new Set(vals).size;
    const ratio = uniq / vals.length;
    if (uniq >= 2 && uniq <= 8 && ratio <= 0.7) (uniq >= 3 ? multi : two).push(c);
  }
  return multi.concat(two);
}
function findCategoricalColumn(cols, rows) { return listCategoricalColumns(cols, rows)[0] || null; }

// Every column that is ≥90% real numbers among its filled values — skips alphanumeric IDs (fail the
// numeric check) and skips purely-numeric sequential IDs (all-unique, consecutive-integer run when
// sorted). File order, so [0] is the first qualifying column exactly as before — required for
// deterministic output, and now also the default the picker starts on.
// A lone dash is how people and chatbots write "no value here" — every chatbot answer in the round
// trips did it. Read as text, three dashes in a column of twenty numbers dropped it below the 90%
// bar and the column vanished from ranking, forecast and summary altogether. A dash is punctuation,
// not a word, so treating it as empty holds in any language (rule 4).
function isEmptyMark(v) { return /^[-–—]$/.test(String(v == null ? "" : v).trim()); }
function listNumericColumns(cols, rows) {
  const n = rows.length, out = [];
  for (const c of cols) {
    const vals = rows.map(r => (r[c] || "").trim()).filter(v => v !== "" && !isEmptyMark(v));
    if (vals.length < n * 0.6) continue;
    const numeric = vals.filter(v => !isNaN(Number(v)));
    if (numeric.length / vals.length < 0.9) continue;
    const nums = numeric.map(Number);
    const uniq = new Set(nums).size;
    const isSequentialId = uniq === nums.length && [...nums].sort((a, b) => a - b).every((v, i, arr) => i === 0 || v === arr[i - 1] + 1);
    if (isSequentialId) continue;
    out.push(c);
  }
  return out;
}
function findNumericColumn(cols, rows) { return listNumericColumns(cols, rows)[0] || null; }

// The column the user actually chose for this role, or the automatic default when they have not chosen
// or their choice is not available in the file now on screen (they may have swapped files since).
// Roles: "group" (categorical), "rank" (numeric), "id" (reconcile's key column).
function pickedCol(role, available, fallback) {
  const p = (window._colPick || {})[role];
  return (p && available.indexOf(p) !== -1) ? p : (fallback !== undefined ? fallback : (available[0] || null));
}
function pickColumn(role, v) { window._colPick = Object.assign({}, window._colPick, { [role]: v }); renderOutput(); }
// One <select> per role, rendered only when there is genuinely a choice to make.
function columnPicker(role, label, available, current) {
  if (!available || available.length < 2) return "";
  return `<div class="pickrow"><span>${esc(label)}</span><select onchange="pickColumn('${role}',this.value)">` +
    available.map(c => `<option value="${esc(c)}"${c === current ? " selected" : ""}>${esc(c)}</option>`).join("") +
    `</select></div>`;
}

// summarize — template-prose (option C). deterministic, numbers from real file.
function summarizeFile(name,text,isCSV,want){
  if(isCSV){
    const {cols,rows}=parseCSV(text);
    if(!rows.length) return {prose:"(ไฟล์นี้ไม่มีข้อมูล)",metrics:[]};
    const n=rows.length;
    const metrics=[["รายการทั้งหมด",n]];
    const groupCol = (want && cols.indexOf(want) !== -1) ? want : findCategoricalColumn(cols, rows);
    let groupCounts = null;
    let prose=`จากข้อมูล ${n} รายการ`;
    if(groupCol){
      const cnt={};rows.forEach(r=>{const v=r[groupCol]||"(ว่าง)";cnt[v]=(cnt[v]||0)+1});
      const sorted=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
      groupCounts=sorted;
      metrics.push(["จำนวนกลุ่ม ("+groupCol+")",sorted.length]);
      prose+=` แบ่งตาม “${groupCol}” ได้ ${sorted.length} กลุ่ม โดยกลุ่มที่มากที่สุดคือ “${sorted[0][0]}” (${sorted[0][1]} รายการ)`;

// search_qa — return matching passages + source. deterministic ranking.
// Terms are cut from the query by SCRIPT, not by vocabulary (rule 4). Thai is typed without spaces and
// often runs straight into an English code — "resetรหัสผ่านsap", "mrpค้างไม่ขึ้นผล" — and read as one
// term, those found nothing at all in chatbot answers that contained every part of them. So:
//   · a run of Latin letters/digits (joined by - _ / .) is a word: it must match a whole word, because
//     as a substring "it" was found inside "Configuration". A letters-only word of 4+ also matches as a
//     prefix (exception → exceptions); anything with a digit must match exactly (MM-2026-0117 must not
//     find MM-2026-01170)
//   · any other run is text without word boundaries: it matches as a substring, and its 5-character
//     fragments match too, so a partly-worded phrase still finds the passage
// Every weight is 1/(passages containing it), so a term present everywhere carries almost nothing — the
// same rarity rule as rarityIndex(). Fragments are cut per term, never across a space: the old grams
// spanned the gap ("kpi เ") and were shown to the user as what matched.
const SEARCH_SHOW = 6, SEARCH_WINDOW = 180;

const RX_RUN = /[^\s\p{Script=Latin}\p{N}\p{P}\p{S}]+/gu;
function searchTerms(query){
  // a case change inside a Latin run is a word break too: "dataMigration" is typed for "data migration"
  const q=String(query==null?"":query).replace(/(\p{Ll})(\p{Lu})/gu,"$1 $2").toLowerCase(), words=[], runs=[];
  (q.match(RX_WORD)||[]).forEach(w=>{ if((w.length>=2||/\d/.test(w)) && words.indexOf(w)===-1) words.push(w); });
  (q.match(RX_RUN)||[]).forEach(r=>{ if(r.length>=2 && runs.indexOf(r)===-1) runs.push(r); });
  return {words,runs};
}
function wordRx(w){
  const s=w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), prefix=/^\p{L}{4,}$/u.test(w);
  return new RegExp("(?<![\\p{Script=Latin}\\p{N}])"+s+(prefix?"":"(?![\\p{Script=Latin}\\p{N}])"),"gu");
}
// Character spans of `tl` that match the query, each [start,end). Thai tone marks and vowels above or
// below a letter are separate code points; a span that ends just before one would cut the letter from
// its mark, so spans grow over trailing marks and never start on one.
function matchSpans(tl,terms,n=5){
  const spans=[];
  terms.words.forEach(w=>{ const rx=wordRx(w); let m; while((m=rx.exec(tl))) spans.push([m.index,m.index+m[0].length]); });
  terms.runs.forEach(r=>{
    let i=tl.indexOf(r); while(i!==-1){ spans.push([i,i+r.length]); i=tl.indexOf(r,i+1); }
    if(r.length>n) ngramSet(r,n).forEach(g=>{ let j=tl.indexOf(g); while(j!==-1){ spans.push([j,j+n]); j=tl.indexOf(g,j+1); } });
  });
  spans.forEach(s=>{ while(s[0]>0 && /\p{M}/u.test(tl[s[0]])) s[0]--; while(s[1]<tl.length && /\p{M}/u.test(tl[s[1]])) s[1]++; });
  spans.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
  const merged=[];
  spans.forEach(s=>{ const last=merged[merged.length-1]; if(last && s[0]<=last[1]) last[1]=Math.max(last[1],s[1]); else merged.push([s[0],s[1]]); });
  return merged;
}
// The stretch of the passage to show: the SEARCH_WINDOW characters holding the most matched text,
// rather than the first 150, which cut the match off whenever it sat further into the paragraph.
function snippetAround(text,spans,max=SEARCH_WINDOW){
  if(text.length<=max) return {start:0,end:text.length};
  let best=0,bestCover=-1;
  spans.forEach(s=>{
    const start=Math.max(0,Math.min(s[0]-30,text.length-max)), end=start+max;
    const cover=spans.reduce((a,t)=>a+Math.max(0,Math.min(end,t[1])-Math.max(start,t[0])),0);
    if(cover>bestCover){bestCover=cover;best=start;}
  });
  // cut at a space when one is near, so the window does not open on "…ี่ 9:" for "กรณีที่ 9:" — Thai
  // has spaces between phrases even without them between words; with none near, at least never start
  // on a mark
  let start=best, end=Math.min(text.length,best+max);
  if(start>0){ const sp=text.lastIndexOf(" ",start); if(sp!==-1 && start-sp<=25) start=sp+1; else while(start>0 && /\p{M}/u.test(text[start])) start--; }
  if(end<text.length){ const sp=text.indexOf(" ",end); if(sp!==-1 && sp-end<=25) end=sp; else while(end<text.length && /\p{M}/u.test(text[end])) end++; }
  return {start,end};

// Escaped HTML of text[start,end) with the matched spans inside <mark>.
function markSpans(text,spans,start,end){
  let h="",pos=start;
  spans.forEach(s=>{
    const a=Math.max(s[0],start), b=Math.min(s[1],end); if(a>=b) return;
    h+=esc(text.slice(pos,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; pos=b;
  });

// Every unit that matches, ranked, plus how many units were searched — the screen says both. It used to
// return the top six only, and "พบ 6 รายการ" was printed over a search that had found 143.
// What a search runs over — a paragraph of a text file, a row of a CSV. Shared with the preview shown
// right after an upload, so the preview lists exactly the units a search would look through.
function searchUnits(files){
  const units=[];
  (files||[]).forEach(f=>{
    if(f.isCSV){const {rows,cols}=parseCSV(f.text);rows.forEach((r,i)=>units.push({t:cols.map(c=>r[c]).join(" · "),ref:"แถว "+(i+1),f}))}
    else paragraphs(f.text).forEach((p,i)=>units.push({t:p,ref:"ย่อหน้า "+(i+1),f}));
  });

}
function searchIndex(query,files){
  const units=searchUnits(files);

  if(!terms.words.length && !terms.runs.length) return {hits:[],total:0,units:units.length};
  const low=units.map(u=>u.t.toLowerCase());
  // rarity over the whole corpus the user uploaded, not one file at a time
  const df=test=>low.reduce((a,t)=>a+(test(t)?1:0),0)||1;
  const wordW=terms.words.map(w=>({w,rx:wordRx(w)})).map(o=>Object.assign(o,{d:df(t=>{o.rx.lastIndex=0;return o.rx.test(t)})}));
  const runW=terms.runs.map(r=>({r,d:df(t=>t.includes(r)),grams:r.length>5?[...ngramSet(r)]:[]}));
  const gramD={}; runW.forEach(o=>o.grams.forEach(g=>{ if(!(g in gramD)) gramD[g]=df(t=>t.includes(g)); }));
  const hits=[];
  units.forEach((u,k)=>{
    const tl=low[k]; let score=0;
    wordW.forEach(o=>{o.rx.lastIndex=0; if(o.rx.test(tl)) score+=3/o.d;});
    // a run's fragments share ONE term's weight between them: summed raw, a long Thai run outweighed
    // an exact English word next to it by the number of fragments it had, and "postเอกสารไม่ได้" put
    // a paragraph without "post" above the one that was about posting a document
    runW.forEach(o=>{ if(tl.includes(o.r)) score+=3/o.d;
      else if(o.grams.length){ let g=0; o.grams.forEach(x=>{ if(tl.includes(x)) g+=1/gramD[x]; }); score+=3*g/o.grams.length; } });
    if(score<=0) return;

    const spans=matchSpans(tl,terms), win=snippetAround(u.t,spans);

    // stretches, and a Thai phrase matched in pieces showed its pieces ("บปัญหาเ", "ตรวจสอบก"); a phrase
    // found only in part is now named whole and flagged as partial instead.
    const found=[];
    wordW.forEach(o=>{ o.rx.lastIndex=0; const m=o.rx.exec(tl); if(m) found.push([u.t.slice(m.index,m.index+m[0].length),false]); });
    runW.forEach(o=>{ const i=tl.indexOf(o.r); if(i!==-1) found.push([u.t.slice(i,i+o.r.length),false]);
      else if(o.grams.some(g=>tl.includes(g))) found.push([o.r,true]); });
    const top=found.slice(0,4), matched=top.map(f=>f[0]), partial=top.map(f=>f[1]);

      src:fileLabel(u.f)+" · "+u.ref,score,matched,partial});

}
function searchPassages(query,files){ return searchIndex(query,files).hits.slice(0,SEARCH_SHOW); }
// Shorten for display and say whether anything was dropped, so callers never show an ellipsis over
// text that was already complete.
function cut(s, max){ const t=String(s==null?"":s); return t.length>max ? {text:t.slice(0,max), more:true} : {text:t, more:false}; }
// A key short or bare enough to turn up by accident — "7", "12", "101" — says nothing when found in
// prose, so it is not searched for. Anything with a non-digit (R-012, BOQ-2026-0023) or a long digit
// run (a PO number) is specific enough that finding it is evidence.
function idUsable(id){ const s=String(id==null?"":id).trim(); return s.length>=3 && (/\D/.test(s) || s.length>=5); }
// Where the key is written in the text, bounded so that R-1 is not found inside R-12 and CASE-0001 is
// not found inside CASE-00010. -1 when absent.
function idPosition(id, text){
  const s=String(id).trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const m=new RegExp("(^|[^A-Za-z0-9])"+s+"(?![A-Za-z0-9])","i").exec(text);
  return m ? m.index+m[1].length : -1;
}
// sequential — reconciliation if a csv + text pair exists; else structured extract
// `wantId` lets the user name the key column themselves. guessCol() looks for id/รหัส/เลข/code and
// otherwise falls back to the first column in the file — a guess that silently skews the whole table
// when it is wrong, with no way for the user to correct it.
function reconcile(files, wantId){
  const csv=files.find(f=>f.isCSV), txt=files.find(f=>!f.isCSV);
  if(!csv||!txt) return null;
  const {cols,rows}=parseCSV(csv.text);
  const idCol=(wantId && cols.indexOf(wantId) !== -1) ? wantId : (guessCol(cols,["id","รหัส","เลข","code"])||cols[0]);
  const textCols=cols.filter(c=>c!==idCol);
  const paras=paragraphs(txt.text);
  // one rarity index per document set, built once and shared by every row
  const idx=rarityIndex(paras);
  // a key that repeats in its own column cannot say which row a paragraph belongs to
  const idCount={}; rows.forEach(r=>{const k=String(r[idCol]||"").trim(); idCount[k]=(idCount[k]||0)+1;});
  // the row is shown the way classify/recommend show one: its key and longest text on a line, the rest
  // behind a disclosure — the key being the column matched on, which the user may have picked
  const lab=recordFields(cols,rows).label, rf={key:idCol, label:lab!==idCol?lab:null};
  const links=[];
  rows.forEach(r=>{
    const rtext=textCols.map(c=>r[c]).join(" ");
    const id=String(r[idCol]||"").trim();
    // The key first. The key column used to be dropped before matching, so a document that names the
    // row outright ("CASE-2026-0014: …") counted for nothing and the row went to whichever paragraph
    // shared the most wording — on a chatbot answer where every note names its case, 9 of 20 rows
    // were linked to another case's note while coverage read 100%. When several paragraphs name the
    // key (notes cross-reference each other: "follows CASE-2026-0002"), the one that names it
    // earliest is the one about it; shared content only breaks an exact tie.
    let best=null, byId=false;
    if(idUsable(id) && idCount[id]===1){
      const named=paras.map((p,pi)=>({p,pi,pos:idPosition(id,p)})).filter(x=>x.pos>=0);
      if(named.length){
        named.forEach(x=>x.score=relatedness(rtext,x.p,idx));
        named.sort((a,b)=>a.pos-b.pos||b.score-a.score);
        best=named[0]; byId=true;
      }
    }
    // No key in the text: score this row against EVERY candidate document, then keep its single best —
    // a reconciliation row means "this item corresponds to that document", so one row cannot honestly
    // link to several.
    if(!best){
      const scored=paras.map((p,pi)=>({p,pi,score:relatedness(rtext,p,idx)})).filter(x=>x.score>0)
        .sort((a,b)=>b.score-a.score);
      if(!scored.length) return;
      best=scored[0];
    }
    let matched=[];
    if(byId) matched.push(id);
    else {
      const pkw=keywords(best.p);
      keywords(rtext).forEach(k=>{if(pkw.has(k))matched.push(k)});
      sharedNgrams(rtext.toLowerCase(),best.p.toLowerCase()).forEach(g=>matched.push(g.trim()));
      matched=dedupMatches(matched);
    }
    // shortened for a scannable table cell, not to hide anything — the flag lets the renderer add
    // an ellipsis only when something was actually removed. 50/55 was too short to tell rows apart.
    links.push({id:r[idCol]||"?",row:cut(rtext,130),doc:cut(best.p.split("\n")[0],130),src:fileLabel(txt),
      matched:matched.slice(0,3),score:best.score,byId,
      // what the table draws: the whole paragraph, where in it the pair was found, and the row as a cell
      para:best.p,pi:best.pi,spans:byId?[[best.pos,best.pos+id.length]]:sharedSpans(rtext,best.p),
      cell:recordCell(r,cols,rf,null)});
  });
  // key matches lead: they are the pairs the file itself asserts
  links.sort((a,b)=>(b.byId-a.byId)||(b.score-a.score));
  const out=links.slice(0,8);
  // coverage, for the renderer to state plainly: how many rows found a counterpart out of how many
  // were read, and how many of those the document names by key rather than resembles.
  out.matchedRows=links.length; out.totalRows=rows.length; out.idRows=links.filter(l=>l.byId).length;
  return out;
}

/* ============ MODE SWITCHING ============ */
function setMode(m){
  document.getElementById("mode-single").classList.toggle("on",m==="single");
  document.getElementById("mode-port").classList.toggle("on",m==="portfolio");
  // "" hands the shown group back to its .ctl flex rule — "block" here stacked the UC picker under the
  // file after any mode switch, however wide the screen
  document.getElementById("single-controls").style.display=m==="single"?"":"none";
  document.getElementById("port-controls").style.display=m==="portfolio"?"":"none";
  // Switching tabs used to always repaint the landing screen, so a workshop file uploaded on one side
  // vanished the moment the user glanced at the other — Use Case → Portfolio → Use Case dropped it
  // with no warning and no way back short of re-uploading. Each side now restores what it had by
  // recomputing from the state that upload already produced — checkJsonShape()/renderPortfolio() are
  // both pure functions of DATA/loaded[], so a re-run here can never disagree with what a fresh upload
  // would show. Only the two upload routes' own transient state resets (mock-up files, the confirm
  // gate) — the same reset a UC switch already causes — because that state lives inside the Playground
  // section this tool never claims to keep open, not inside the workshop's own record.
  const jc=document.getElementById("jsonCheck");
  if(m==="single"){
    if(UC_LIST.length){
      if(jc) renderJsonCheck(checkJsonShape(DATA, SINGLE_FILE_NAME));
      renderPicker();
      renderUC();
    } else {
      if(jc) jc.innerHTML="";
      document.getElementById("main").innerHTML=emptyState(m);
    }
  } else {
    if(jc) jc.innerHTML=""; // the file-check box only ever describes a single-UC export
    if(PORT_LOADED){
      renderPortfolio(PORT_LOADED);
    } else {
      document.getElementById("main").innerHTML=emptyState(m);
    }
  }
  wireDropzone();
}

// The landing screen was one grey line of text pointing at a file input in the top bar. It said what
// to do but gave nothing to do it with, and never mentioned that the file stays on the machine — the
// one thing a client is entitled to know before handing over a workshop export. Rendered from here
// rather than written into the page twice, since setMode() repaints the same area.

    <div class="drop-or">— หรือ —</div>

      <span class="drop-priv">🔒 ไฟล์ถูกอ่านในเบราว์เซอร์ของท่านเท่านั้น ไม่ถูกอัปโหลดหรือส่งออกจากเครื่อง</span></div>

// which input the zone stands in for depends on the mode the user is in
function modeInput(){
  const port=document.getElementById("port-controls");
  const isPort = port && port.style.display !== "none";
  return document.getElementById(isPort ? "jsonFilesMulti" : "jsonFile");
}
function openPicker(){ const el=modeInput(); if(el && el.click) el.click(); }
// Drop is wired on the zone only, not the whole page: a stray drop anywhere else would otherwise
// replace whatever the facilitator currently has on screen mid-discussion.
// The answer-file drop box. A drop is handed to the real #mockUp and its own change handler, so a
// dropped file takes exactly the path a picked one does.
function wireMockDrop(){
  const z=document.getElementById("mockDrop"), inp=document.getElementById("mockUp");
  if(!z || !z.addEventListener || !inp) return;
  const stop=e=>{e.preventDefault();e.stopPropagation();};
  ["dragenter","dragover"].forEach(ev=>z.addEventListener(ev,e=>{stop(e);z.classList.add("over")}));
  ["dragleave","dragend"].forEach(ev=>z.addEventListener(ev,e=>{stop(e);z.classList.remove("over")}));
  z.addEventListener("drop",e=>{
    stop(e); z.classList.remove("over");
    const files=e.dataTransfer && e.dataTransfer.files; if(!files || !files.length) return;
    try{ const dt=new DataTransfer(); Array.from(files).forEach(f=>dt.items.add(f)); inp.files=dt.files; inp.dispatchEvent(new Event("change")); }
    catch(err){ /* a browser that cannot hand a drop to an input still has the click route */ }
  });
}
function wireDropzone(){
  const z=document.getElementById("dropzone");
  // the headless test harness stubs getElementById with a plain object, and a browser that never
  // painted the landing screen has no zone at all — both are "nothing to wire", not an error
  if(!z || !z.addEventListener) return;
  const stop=e=>{e.preventDefault();e.stopPropagation();};
  ["dragenter","dragover"].forEach(ev=>z.addEventListener(ev,e=>{stop(e);z.classList.add("over")}));
  ["dragleave","dragend"].forEach(ev=>z.addEventListener(ev,e=>{stop(e);z.classList.remove("over")}));
  z.addEventListener("drop",e=>{
    stop(e);
    z.classList.remove("over");
    const files=e.dataTransfer && e.dataTransfer.files;
    if(!files || !files.length) return;
    const el=modeInput();
    // hand the drop to the real input and fire its own change handler, so dropped and picked files
    // take exactly the same path — including every check in loadJSON()/loadPortfolio()
    try{
      const dt=new DataTransfer();
      const take = (el && el.multiple) ? Array.from(files) : [files[0]];
      take.forEach(f=>dt.items.add(f));
      el.files=dt.files;
      el.dispatchEvent(new Event("change"));
    }catch(err){
      renderJsonCheck({status:"unusable", facts:{fileName:files[0].name, schemaVersion:null, teamName:null, processName:null, processId:null, ucCount:0},
        missing:[{what:"drop", cost:"เบราว์เซอร์นี้รับไฟล์จากการลากวางไม่ได้ — กดปุ่ม เลือกไฟล์จากเครื่อง แทน"}]});
    }
  });
}

/* ============ SINGLE UC MODE ============ */
// What the page needs from an export, checked once at load instead of letting each renderer discover
// the gap on its own. Three outcomes only: usable, usable with named gaps, or not usable — and a gap
// is always reported as what it costs on screen, never repaired or guessed around (CLAUDE.md rule 4).
// Pure: everything arrives in `data`, so the whole table is testable without a DOM.
// a null/ragged entry is normalised to an empty UC rather than skipped: it still occupies a slot in
// the file, and reporting it as a UC missing every field is truer than quietly shortening the list.
// Shared by checkJsonShape() and loadJSON() on purpose — when only the report normalised, the screen
// said "ใช้งานได้บางส่วน" and then renderPicker()/renderUC() threw on the raw null and left #main
// blank, which is the silent failure CLAUDE.md rule 4 forbids.
function ucListFrom(data){
  const raw = Array.isArray((data||{}).useCases) ? data.useCases : [];
  return raw.map(u => (u && typeof u === "object") ? u : {});
}
function checkJsonShape(data, fileName){
  const d = data || {};
  const meta = d.meta || {};
  const ucs = ucListFrom(d);
  const facts = {
    fileName: fileName || "—",
    schemaVersion: d.schemaVersion || null,
    teamName: meta.teamName || null,
    processName: meta.processName || null,
    processId: meta.processId || null,
    ucCount: ucs.length
  };
  const missing = [];
  if(!Array.isArray(d.useCases)) return {status:"unusable", facts, missing:[{what:"useCases", cost:"ไม่พบรายการ useCases ในไฟล์ — อาจไม่ใช่ไฟล์ export จาก TeamCanvas"}]};
  if(!ucs.length) return {status:"unusable", facts, missing:[{what:"useCases", cost:"ไฟล์นี้ไม่มี Use Case อยู่เลย — ไม่มีอะไรให้แสดง"}]};

  // file-level facts the header and the generated Prompt print
  if(!facts.schemaVersion) missing.push({what:"schemaVersion", cost:"ไม่รู้เวอร์ชัน schema ของไฟล์ — ถ้าผลดูแปลก ให้สงสัยว่า export มาจาก TeamCanvas คนละเวอร์ชัน"});
  if(!facts.teamName) missing.push({what:"meta.teamName", cost:"หัวเรื่องและ Prompt จะไม่มีชื่อทีม (ใช้ชื่อฟังก์ชันแทนถ้ามี)"});
  if(!facts.processName) missing.push({what:"meta.processName", cost:"ไม่รู้ว่า Use Case ชุดนี้มาจากกระบวนการไหน"});

  // per-UC fields, each named by what the user loses on screen when it is absent
  const per = [
    {key:"title", get:u=>((u.business||{}).title), label:"business.title", cost:"ชื่อ Use Case ในตัวเลือกและหัวเรื่อง"},
    {key:"task", get:u=>((u.techInput||{}).aiTaskType), label:"techInput.aiTaskType", cost:"จัดเข้าหมวด ทั่วไป — จะไม่มีช่องอัปโหลดและไม่มี Prompt ให้ดาวน์โหลด"},
    {key:"pain", get:u=>((u.business||{}).painAddressed), label:"business.painAddressed", cost:"กล่องปัญหาปัจจุบันและหัวข้อ Pain ใน Prompt จะว่าง"},
    {key:"benefit", get:u=>((u.business||{}).expectedBenefit), label:"business.expectedBenefit", cost:"หัวข้อผลลัพธ์ที่คาดหวังจะว่าง"},
    {key:"data", get:u=>{const ds=(u.techInput||{}).dataSets; return (Array.isArray(ds)&&ds.length)?ds:null}, label:"techInput.dataSets", cost:"การ์ดสถานะข้อมูลไม่มีแหล่งข้อมูลให้แสดง"}
  ];
  per.forEach(p=>{
    const bad = ucs.map((u,i)=>({u,i})).filter(x=>{ const v=p.get(x.u); return !(v && String(v).trim()); });
    if(!bad.length) return;
    // name the UC rather than only counting them, so the user knows which one to go back and fill in
    const names = bad.slice(0,3).map(x=>((x.u.business||{}).title||("UC #"+(x.i+1))));
    const more = bad.length>3 ? " และอีก "+(bad.length-3)+" รายการ" : "";
    missing.push({what:p.label, count:bad.length, total:ucs.length, where:names.join(", ")+more, cost:p.cost});
  });

  return {status: missing.length ? "partial" : "ready", facts, missing};
}

// Rendered above #main, which renderUC() rewrites on every UC switch — the verdict belongs to the file,
// not to the UC being viewed, so it must outlive those rewrites.
function renderJsonCheck(res){
  const el=document.getElementById("jsonCheck"); if(!el) return;
  const f=res.facts;
  const tone = res.status==="ready" ? "box-green" : (res.status==="partial" ? "box-amber" : "box-red");
  const label = res.status==="ready" ? "พร้อมใช้งาน" : (res.status==="partial" ? "ใช้งานได้บางส่วน" : "ใช้งานไม่ได้");
  const pill = res.status==="ready" ? "pill-ok" : (res.status==="partial" ? "pill-warn" : "pill-bad");
  let h=`<div class="jcheck"><div class="box ${tone}">`;
  h+=`<h4>ไฟล์ที่อ่าน <span class="pill ${pill}">${label}</span></h4>`;
  h+=`<div class="jfacts">`+[
    ["ไฟล์", esc(f.fileName)],
    ["ทีม", f.teamName ? esc(f.teamName) : "<i>ไม่ระบุ</i>"],
    ["Process", f.processName ? esc(f.processName)+(f.processId?" ("+esc(f.processId)+")":"") : "<i>ไม่ระบุ</i>"],
    ["Use Cases", String(f.ucCount)]
  ].map(p=>`<div>${p[0]}: <b>${p[1]}</b></div>`).join("")+`</div>`;
  if(res.missing.length){
    h+=`<ul class="jmiss">`+res.missing.map(m=>{
      const scope = m.count ? " <b>("+m.count+"/"+m.total+" UC)</b>" : "";
      const where = m.where ? " — "+esc(m.where) : "";
      return `<li><code>${esc(m.what)}</code>${scope}${where}<br>ผลที่ตามมา: ${esc(m.cost)}</li>`;
    }).join("")+`</ul>`;
  }
  h+=`</div></div>`;
  el.innerHTML=h;
}

function loadJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    let parsed;
    try{parsed=JSON.parse(ev.target.result);}
    catch(err){
      renderJsonCheck({status:"unusable", facts:{fileName:f.name, schemaVersion:null, teamName:null, processName:null, processId:null, ucCount:0},
        missing:[{what:"JSON", cost:"อ่านไฟล์ไม่ได้ — รูปแบบ JSON ไม่ถูกต้อง: "+String(err.message||err)}]});
      document.getElementById("main").innerHTML=emptyState("single"); wireDropzone();
      return;
    }
    // SINGLE_FILE_NAME travels with DATA so setMode() can recompute the same jsonCheck verdict when
    // the user switches back to this mode, instead of caching a copy of its rendered HTML — same
    // "no third source of truth" rule CAT_DATA_CONTRACT is held to.
    DATA=parsed; SINGLE_FILE_NAME=f.name;
    META=DATA.meta||{};
    UC_LIST=ucListFrom(DATA);
    // report before rendering: a partial file still renders, and the user needs to know which gaps
    // explain what they are about to see rather than discovering them field by field
    const res=checkJsonShape(DATA, f.name);
    renderJsonCheck(res);
    if(res.status==="unusable"){ document.getElementById("main").innerHTML=emptyState("single"); wireDropzone(); return; }
    SEL=0; renderPicker(); renderUC();
  };
  r.readAsText(f);
}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function nl2br(s){return esc(s).replace(/\n/g,"<br>")}
// spec §5: the provenance banner is not always on-screen (long output, several files/tables, or a
// scrolled screenshot) — the per-file name shown in each output block must carry its own mock-up flag.
// Returns RAW text (same contract as f.name) so callers keep applying esc() themselves at the call site.
function fileLabel(f){ return (f && f.simulated ? "[จำลอง] " : "") + (f ? f.name : ""); }
// resolve a painAddressed ID (e.g. "P1-pain-1") to its short label in w2_critique.painSpots[] (e.g. "GC - ...").
// falls back to the long pain description if shortName is missing, then null (never blank/fabricated)
// if the id has no match at all — a join miss, not an empty field.
function resolvePain(painId, painSpots) {
  if (!painId) return null;
  const found = (painSpots || []).find(p => p.id === painId);
  if (!found) return null;
  return found.shortName || found.pain || null;
}

// Extract pain references out of an aiHelp string. Returns the deduped pain names plus the text with
// those references removed. Callers compose their own fallback/joining — renderUC() and buildPrompt()
// intentionally differ on both. Teams type the reference three ways (all seen in the corpus):
//   "เพิ่ม pain-2: name"   ·   "pain-3: name" on a line of its own   ·   "เพิ่ม Pain-2 (name)"
// A bare "pain-N" counts only at the start of a line, so a sentence that mentions one is left alone.
const AIHELP_PAIN_RX = /(?:เพิ่ม\s*|^[ \t]*)pain-\d+\s*(?::\s*([^\n]+)|\(([^)\n]+)\)[ \t]*)/gim;
function parseAiHelpPains(aiHelp) {
  const src = aiHelp || "";
  const pains = [];
  let m;
  AIHELP_PAIN_RX.lastIndex = 0;
  while ((m = AIHELP_PAIN_RX.exec(src)) !== null) {
    const name = (m[1] || m[2] || "").trim();
    if (name && !pains.includes(name)) pains.push(name);
  }
  const clean = src.replace(AIHELP_PAIN_RX, "").replace(/\n{2,}/g, "\n\n").trim();
  return { pains, clean };
}

  }));

/* ============ UPLOAD VALIDATION ============ */
// The upload route used to hand every selected file straight to FileReader.readAsText(). A .xlsx
// or .pdf read that way does not fail — it yields mojibake that keywords()/parseCSV() will happily
// analyse, producing confident-looking output. Refusing by name up front is the only
// point where that is still cheap to catch. Nothing here repairs a file (CLAUDE.md rule 4) — it
// reports which file and why, and lets the user decide.
const UPLOAD_MAX_BYTES = 5 * 1024 * 1024;
const UPLOAD_TEXT_EXT = ["csv", "txt", "md"];
// binary containers, named so the message can say what the file actually is instead of a generic refusal
const UPLOAD_BINARY_HINT = {
  pdf:"PDF", xlsx:"Excel", xlsm:"Excel", xlsb:"Excel", xls:"Excel", docx:"Word", doc:"Word",
  pptx:"PowerPoint", ppt:"PowerPoint", png:"รูปภาพ", jpg:"รูปภาพ", jpeg:"รูปภาพ", gif:"รูปภาพ",
  webp:"รูปภาพ", zip:"ไฟล์บีบอัด", rar:"ไฟล์บีบอัด"
};
function fileExt(name){ const m=/\.([a-z0-9]+)$/i.exec(String(name||"")); return m ? m[1].toLowerCase() : ""; }
function formatBytes(n){
  if(typeof n!=="number" || !isFinite(n)) return "";
  if(n < 1024) return n+" B";
  if(n < 1024*1024) return (n/1024).toFixed(1)+" KB";
  return (n/1024/1024).toFixed(1)+" MB";
}
// Runs BEFORE any FileReader, so an oversized spreadsheet is never slurped into memory just to be
// discarded afterwards. size is only checked when the host actually reports one (test stubs do not).
function screenUploads(list){
  const accept=[], reject=[];
  Array.from(list||[]).forEach(f=>{
    const ext=fileExt(f.name), sz=f.size;
    if(UPLOAD_BINARY_HINT[ext]){
      reject.push({name:f.name, reason:"เป็นไฟล์ "+UPLOAD_BINARY_HINT[ext]+" — เครื่องมือนี้อ่านได้เฉพาะ CSV / TXT / MD กรุณา export เป็น CSV ก่อน"});
    } else if(UPLOAD_TEXT_EXT.indexOf(ext)===-1){
      reject.push({name:f.name, reason:"นามสกุล ."+(ext||"(ไม่มี)")+" ไม่รองรับ — ใช้ได้เฉพาะ .csv .txt .md"});
    } else if(typeof sz==="number" && sz > UPLOAD_MAX_BYTES){
      reject.push({name:f.name, reason:"ไฟล์ใหญ่เกิน "+formatBytes(UPLOAD_MAX_BYTES)+" (ไฟล์นี้ "+formatBytes(sz)+")"});
    } else if(typeof sz==="number" && sz===0){
      reject.push({name:f.name, reason:"ไฟล์ว่าง (0 ไบต์)"});
    } else accept.push(f);
  });
  return {accept, reject};
}
// Content checks that cannot run until the read finishes. A CSV with a header and no data rows is
// the one shape every renderer silently returns nothing for, so it is named here instead.
function screenContent(rec){
  if(rec.readFailed) return "อ่านไฟล์ไม่สำเร็จ — ไฟล์อาจเสียหายหรือถูกล็อกอยู่";
  if(!rec.text || !rec.text.trim()) return "อ่านได้แต่ไม่มีเนื้อหา (ไฟล์ว่าง)";
  if(rec.isCSV){
    let parsed=null;
    try{ parsed=parseCSV(rec.text); }catch(e){ return "อ่านเป็นตาราง CSV ไม่ได้"; }
    if(!parsed || !parsed.rows || !parsed.rows.length) return "เป็น CSV ที่ไม่มีแถวข้อมูล (มีแต่หัวตาราง)";
  }
  return null;
}
// Reading a local file is usually instant, but a multi-MB CSV on a slow disk is not, and a screen
// that does not change is indistinguishable from an upload that did nothing. Inputs are disabled
// meanwhile so a second selection cannot interleave with the first read.
function setUploadBusy(on){
  const out=document.getElementById("output");
  if(on && out) out.innerHTML = '<div class="box box-gray">⏳ กำลังอ่านไฟล์…</div>';
  const pg=document.getElementById("playground");
  const inputs=(pg && pg.querySelectorAll) ? pg.querySelectorAll("input[type=file]") : [];
  Array.from(inputs||[]).forEach(el=>{ el.disabled = !!on; });
}
// Shared tail for both routes: split what survived the content check from what did not, record the
// refusals for renderOutput() to show, and hand back only the usable records.
function partitionRead(records, rejects){
  const good=[];
  records.forEach(rec=>{
    const why=screenContent(rec);
    if(why) rejects.push({name:rec.name, reason:why}); else good.push(rec);
  });
  return good;
}
function readAsRecord(f, simulated){
  return new Promise(res=>{
    const r=new FileReader();
    const base={name:f.name, size:f.size, isCSV:/\.csv$/i.test(f.name)};
    if(simulated) base.simulated=true;
    r.onload=e=>res(Object.assign({}, base, {text:e.target.result}));
    r.onerror=()=>res(Object.assign({}, base, {text:"", readFailed:true}));
    r.readAsText(f);
  });
}

// chatbot mock-up upload — the only upload path (real-data upload was removed on the owner's decision,
// 2026-09-25, to avoid the many shapes real files come in). Every file it produces is flagged
// simulated:true so renderOutput() can announce it is not audited output. #mockUp accepts `multiple`
// because a "sequential" prompt asks the chatbot for a CSV+text pair (reconcile() needs both).
function onMockUpload(){
  const inp=document.getElementById("mockUp");const fl=inp&&inp.files;
  if(!fl||!fl.length) return;
  const screened=screenUploads(fl);
  const rejects=screened.reject.slice();
  // the format on screen when the user chose the files — the Prompt they will have run
  const fmt=effectiveCat((window._ucCtx||{}).cat);
  setUploadBusy(true);
  const jobs=screened.accept.map(f=>readAsRecord(f, true));
  Promise.all(jobs).then(records=>{
    const good=partitionRead(records, rejects);
    window._fileRejects=rejects;
    // an upload where nothing survived must not wipe what is already on screen. window._files is what
    // renderOutput() renders from, so a refused .pdf still blanked a good chatbot sample and left the
    // user with a red box and no output. Keep what was there; the refusal is reported beside it.
    // ...and remember which format's Prompt these answer, so a later change of format can say so
    if(good.length){ window._files=good; window._filesCat=fmt; }
    setUploadBusy(false);
    renderOutput();
  });
}

function renderStructuredFallback(files, reason) {
  let h = `<div class="box box-gray">${esc(reason)}</div><h3 style="margin-top:14px">แสดงการรวบรวม/จัดโครงข้อมูลแทน</h3>`;
  files.forEach(f => {

    h += `<div class="prose">${esc(s.prose)}</div></div>`;

function computeExtract(cols, rows) {
  if (!rows.length) return null;
  return { total: rows.length, sample: rows.slice(0, PREVIEW_CAP).map(r => cols.map(c => [c, r[c]])) };
}
function computeExtractText(paras) {
  if (!paras.length) return null;
  return { total: paras.length, sample: paras.slice(0, PREVIEW_CAP) };
}

/* ---- step 2: what the output itself says, beyond the top of the list ----
 * These are arithmetic and nothing else. They were added because the renderers answered with the
 * first three rows of a sort and stopped: on a 24-month file that is three numbers out of 24, with
 * nothing saying whether those three are far above the rest or barely ahead of them.
 *
 * ⛔ They return numbers, never sentences. Measured on F2_tickets_large.csv, which is generated with
 * no relationship between any two columns: the mean csat per category comes out 3.10 / 3.10 / 2.95 /
 * 2.98 / 2.83. Written into a table those are facts about the file. Written into a sentence —
 * "category A scores lower than category B" — they read as a finding, and every one of them is noise.
 * A comparison needs a threshold proving how far apart is far enough to speak, and no test file has
 * columns that genuinely relate, so there is nothing to derive one from. Tables only.
 */

// Thousand separators, and at most one decimal place — a per-group total of 1127275 is unreadable
// without them, and an average of 140909.42857 is precision the source data never had.
function fmtNum(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  const r = Math.round(v * 10) / 10;
  const parts = String(Math.abs(r)).split(".");
  return (r < 0 ? "-" : "") + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (parts[1] ? "." + parts[1] : "");
}

/* ---- the forecast chart ----
 * The forecast renderer reduced a column to two averages and threw the rest away, so a seasonal
 * series, a single jump and pure noise all rendered as the same two numbers and a percentage. On a
 * chatbot file whose values swung between 3,500 and 16,000 the screen read "down 1%", and nothing on it
 * could show that a gap of 67 inside a range of 12,500 is no trend at all.
 *
 * This draws every value the forecast actually split, in the order it split them, with the two
 * half-averages laid over the halves they summarise — so the number it reports can be read against the
 * data it came from.
 *
 * ⛔ The region to the right carries NO forecast. The tool computes none (computeForecast() returns two
 * averages), so the region holds no value, no label with a number, and no centre line: only a cone
 * marking where a real forecast would sit once the system is built with a consultant. Its width is a
 * fixed share of the plot on every file — it is NOT derived from the data's variance, and the caption
 * under the chart says so, because a narrow cone read as "the model is confident" would be a claim this
 * tool has no basis to make.
 */
const CHART_CONE = 0.30;       // cone half-height as a share of the plot height, identical on every file
const CHART_POINTS_MAX = 60;   // above this, markers turn into clutter; the line alone carries the shape

function seriesChart(vals, col) {
  if (!vals || vals.length < 2) return "";
  const W = 640, H = 190, L = 60, R = 12, T = 22, B = 30, FUT = 0.28;
  // reduce, not Math.min(...vals): a file from a future workshop may carry many thousands of rows
  const lo = vals.reduce((m, v) => v < m ? v : m, Infinity), hi = vals.reduce((m, v) => v > m ? v : m, -Infinity);
  const span = (hi - lo) || 1;
  const plotW = W - L - R, histW = plotW * (1 - FUT), x0 = L + histW, plotH = H - T - B;
  const x = i => L + (i / (vals.length - 1)) * histW;
  const y = v => T + (1 - (v - lo) / span) * plotH;
  const clampY = py => Math.max(T, Math.min(H - B, py));
  const mid = Math.floor(vals.length / 2);
  const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
  const a1 = avg(vals.slice(0, mid)), a2 = avg(vals.slice(mid));
  const last = vals[vals.length - 1];

  let s = `<svg class="fchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="ค่าในคอลัมน์ ${esc(col)} ตามลำดับแถว ${vals.length} แถว" style="width:100%;height:auto;max-width:680px;display:block">`;
  s += `<rect x="${x0}" y="${T}" width="${W - R - x0}" height="${plotH}" style="fill:var(--line-soft)"/>`;
  s += `<line x1="${x0}" y1="${T}" x2="${x0}" y2="${H - B}" style="stroke:var(--faint);stroke-width:1"/>`;
  [hi, lo].forEach(v => {
    s += `<line x1="${L}" y1="${y(v)}" x2="${x0}" y2="${y(v)}" style="stroke:var(--line);stroke-width:1"/>`;
    s += `<text x="${L - 8}" y="${y(v) + 4}" font-size="11" style="fill:var(--faint)" text-anchor="end">${fmtNum(v)}</text>`;
  });
  s += `<line class="fhalf" x1="${x(0)}" y1="${y(a1)}" x2="${x(mid - 1)}" y2="${y(a1)}" style="stroke:var(--amber);stroke-width:2;stroke-dasharray:5,3"/>`;
  s += `<line class="fhalf" x1="${x(mid)}" y1="${y(a2)}" x2="${x(vals.length - 1)}" y2="${y(a2)}" style="stroke:var(--amber);stroke-width:2;stroke-dasharray:5,3"/>`;
  s += `<polyline class="fline" points="${vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ")}" style="fill:none;stroke:var(--accent);stroke-width:1.9"/>`;
  if (vals.length <= CHART_POINTS_MAX) {
    vals.forEach((v, i) => { s += `<circle class="fpt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" style="fill:var(--accent)"><title>แถวที่ ${i + 1}: ${fmtNum(v)}</title></circle>`; });
  }
  // the reserved region: two dashed edges and a faint fill between them, no centre line, no value
  const cy = y(last), up = clampY(cy - plotH * CHART_CONE), dn = clampY(cy + plotH * CHART_CONE);
  s += `<g class="fcone"><path d="M ${x0} ${cy} L ${W - R} ${up} L ${W - R} ${dn} Z" style="fill:var(--faint);fill-opacity:0.16"/>`;
  s += `<line x1="${x0}" y1="${cy}" x2="${W - R}" y2="${up}" style="stroke:var(--faint);stroke-width:1.2;stroke-dasharray:4,4"/>`;
  s += `<line x1="${x0}" y1="${cy}" x2="${W - R}" y2="${dn}" style="stroke:var(--faint);stroke-width:1.2;stroke-dasharray:4,4"/>`;
  // the label goes on whichever side the cone is not: when the file ends high the cone's upper edge
  // runs along the top of the plot, and a label pinned there sat on top of it
  const labelY = cy < T + plotH / 2 ? H - B - 7 : T + 13;
  s += `<text x="${(x0 + W - R) / 2}" y="${labelY}" font-size="11" style="fill:var(--muted)" text-anchor="middle">ช่วงที่ผลพยากรณ์จะอยู่</text></g>`;
  s += `<text x="${L}" y="${H - B + 17}" font-size="11" style="fill:var(--faint)">แถวที่ 1</text>`;
  s += `<text x="${x0}" y="${H - B + 17}" font-size="11" style="fill:var(--faint)" text-anchor="middle">จบข้อมูลในไฟล์ (แถวที่ ${vals.length})</text>`;
  s += `</svg>`;

  // the gap between the halves, set against the range the values actually cover — arithmetic, no verdict
  const gap = Math.abs(a2 - a1);
  const ratio = (hi - lo) > 0 ? `<b>${fmtNum(gap / (hi - lo) * 100)}%</b> ของช่วงที่ค่าในคอลัมน์นี้เหวี่ยง (${fmtNum(hi - lo)})` : `ค่าในคอลัมน์นี้เท่ากันทุกแถว`;
  return `<div class="fchart-wrap" style="margin-top:12px">${s}` +
    `<div style="font-size:11.5px;color:var(--faint);margin-top:3px">${esc(col)} · เรียงตามลำดับแถวในไฟล์ · เส้นทึบ = ค่าในไฟล์ · เส้นประส้ม = ค่าเฉลี่ยของแต่ละครึ่ง</div>` +
    `<div class="prose" style="margin-top:8px">ความต่างระหว่างสองครึ่ง <b>${fmtNum(gap)}</b> = ${ratio}</div>` +
    `<div class="box box-gray fcone-note" style="margin-top:8px;font-size:12.5px"><b>ช่วงทางขวาไม่มีตัวเลข</b> — เครื่องมือนี้ไม่ได้คำนวณค่าพยากรณ์ และความกว้างของช่วงไม่ได้คำนวณจากข้อมูล ส่วนนี้แสดงเพียงตำแหน่งที่ผลจะปรากฏเมื่อทำระบบจริงกับที่ปรึกษา</div></div>`;
}

/* ---- step 3: the shape of the output, before there is a file ----
 * Only summarize ever showed one. The other six answered with a single line telling the user to go
 * and upload something, so anyone arriving without a file — most of a workshop room — could not see
 * what the tool would give them. That is the question this product exists to answer, and the renderers
 * have more to show than when that line was written: shares, spreads, per-group totals.
 *
 * ⛔ Invented numbers, and they say so twice: the amber note above and the sentence below. Both lines
 * live here rather than in seven branches so the claim cannot drift apart between renderers.
 * ⛔ Placeholders stay generic — "กลุ่ม A", "คอลัมน์ที่ใช้จัดกลุ่ม", "แถวจากไฟล์ของท่าน". No UC title

// the classify/recommend row cell as recordCellHtml() draws it, with placeholders for the values
const SAMPLE_ROWCELL = `<details class="rowcell"><summary><b>รหัสแถว</b> ข้อความจากคอลัมน์ที่ยาวที่สุด</summary><table>` +

const SAMPLE_FOOT = `<div class="prose" style="margin-top:8px"><b>ตัวเลขชุดนี้สมมติขึ้นเพื่อแสดงรูปแบบเท่านั้น</b> ไม่ได้มาจากไฟล์ใด</div>`;
// One invented series behind every sample figure that describes a column of numbers — the forecast
// cards, its chart, and the spread table recommend and forecast share. They used to be typed in
// separately and disagreed: the forecast cards read 148.2 / 172.7 over a spread built from other values.
// These are the values of the synthetic fixture F1_ops_monthly.csv (tickets), which no customer supplied.
const SAMPLE_SERIES = [138,146,130,141,126,124,126,140,136,146,126,148,173,201,170,198,176,181,195,181,189,177,203,181];

// needs two files of different kinds, and one needs a file before its search box does anything.
function sampleHint(t) { return `<div class="samplehint" style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">${t}</div>`; }

function sampleShape(cat) {
  if (cat === "classify") {
    return SAMPLE_NOTE +

      [["กลุ่ม A", 52, "1,240,500", "23,855.8"], ["กลุ่ม B", 41, "986,300", "24,056.1"], ["กลุ่ม C", 35, "702,100", "20,060"]].map(g =>

    const sr = SAMPLE_SERIES, mid = Math.floor(sr.length / 2), avg = a => a.reduce((t, v) => t + v, 0) / a.length;
    const a1 = avg(sr.slice(0, mid)), a2 = avg(sr.slice(mid)), pct = Math.round((a2 - a1) / Math.abs(a1) * 100);

  }
  if (cat === "extract") {
    // same four blocks extractCSVBlocks() draws with a file
    const f = (k, t, fill, ex, amber) => `<tr><td style="font-weight:600">${k}</td><td>${t}</td><td${amber ? ` style="color:var(--amber);font-weight:600"` : ``}>${fill}</td><td style="color:var(--muted)">${ex}</td></tr>`;
    return SAMPLE_NOTE +
      `<div class="metric-row"><div class="metric"><div class="n">128</div><div class="l">รายการที่สกัดได้</div></div>` +
      `<div class="metric"><div class="n">5</div><div class="l">ฟิลด์ต่อรายการ</div></div>` +

      `<div class="outsub">ฟิลด์ที่ได้ — ประเภทที่ตรวจพบจากค่าในคอลัมน์ และมีค่ากี่แถว</div>` +
      `<table style="margin-top:6px"><thead><tr><th>ฟิลด์</th><th>ประเภท</th><th>มีค่า</th><th>ตัวอย่างค่า</th></tr></thead><tbody>` +
      f("ชื่อคอลัมน์ที่ 1", "รหัส (ไม่ซ้ำทุกแถว)", "128/128", "ค่าจากไฟล์ของท่าน …") + f("ชื่อคอลัมน์ที่ 2", "หมวดหมู่", "128/128", "ค่าจากไฟล์ของท่าน …") +

      f("ชื่อคอลัมน์ที่ 5", "ข้อความ", "37/128", "ค่าจากไฟล์ของท่าน …", true) + `</tbody></table>` +
      `<div class="outsub">คอลัมน์ที่มีแค่ 2 ค่า — มักเป็นธงข้อยกเว้นหรือรายการที่ต้องตรวจ</div>` +
