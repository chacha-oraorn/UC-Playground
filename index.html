      tr(["คอลัมน์ตัวเลขที่ 1", 128, 124, 159, 203]) + tr(["คอลัมน์ตัวเลขที่ 2", 128, "5.4", "7.1", "8"]) + `</tbody></table>` +
      `<div class="outsub">ค่าเฉลี่ยของแต่ละกลุ่ม</div><table style="margin-top:6px"><thead><tr><th>คอลัมน์ที่ใช้จัดกลุ่ม</th><th>จำนวน</th><th>เฉลี่ย คอลัมน์ตัวเลขที่ 1</th><th>เฉลี่ย คอลัมน์ตัวเลขที่ 2</th></tr></thead><tbody>` +
      tr(["กลุ่ม A", 52, "166.2", "6.9"]) + tr(["กลุ่ม B", 41, "158.7", "7.2"]) + tr(["กลุ่ม C", 35, "149.8", "7.3"]) + `</tbody></table>` +
      `<div class="outsub">คอลัมน์ที่มีแค่ 2 ค่า — มักเป็นธงข้อยกเว้นหรือสถานะ</div><table style="margin-top:6px"><thead><tr><th>คอลัมน์ที่มี 2 ค่า</th><th>ค่า</th><th>จำนวน</th><th>% ของทั้งหมด</th></tr></thead><tbody>` +
      `<tr><td rowspan="2" style="font-weight:600">คอลัมน์ที่มี 2 ค่า</td><td>ค่าที่ 1</td><td>18</td><td>14.1%</td></tr><tr><td>ค่าที่ 2</td><td>110</td><td>85.9%</td></tr></tbody></table>` +
      SAMPLE_FOOT;
  }
  return "";
}

// The numbers actually present in a column, ascending. Blank and non-numeric cells are dropped, and
// the count of what survived is returned with them: a column where 1 in 20 cells holds text is ranked
// on 19 rows, and the caller has to be able to say so.
function columnNumbers(rows, col) {
  const vals = rows.map(r => (r[col] || "").trim()).filter(v => v !== "" && !isNaN(Number(v))).map(Number);
  return vals.sort((a, b) => a - b);
}

// min / median / max / sum over an ascending array. Median of an even count is the mean of the two
// middle values, which is the definition the pre-registered answer key in Test Files/synthetic/
// README.md (set H) was computed with.
function spread(sorted) {
  const n = sorted.length;
  if (!n) return null;
  const mid = Math.floor(n / 2);
  return { n, min: sorted[0], max: sorted[n - 1],
    median: n % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2,
    sum: sorted.reduce((s, v) => s + v, 0) };
}

// How much of the column's total the k largest values account for. Negative values would make this
// ratio meaningless — a total near zero sends it to infinity, and "16% of the whole" stops being a
// sentence anyone can act on — so it is only computed when every value is at least zero.
function topShare(sorted, k) {
  const n = sorted.length;
  if (!n || sorted[0] < 0) return null;
  const sum = sorted.reduce((s, v) => s + v, 0);
  if (sum <= 0) return null;
  const top = sorted.slice(Math.max(0, n - k));
  return { k: top.length, topSum: top.reduce((s, v) => s + v, 0),
    pct: Math.round(top.reduce((s, v) => s + v, 0) / sum * 100) };
}

// Per-group row count and share, plus the total and mean of a numeric column when one is named.
// Share is carried because the raw counts hid the thing worth seeing: on the 200-row F3 fixture the
// screen read 186 / 6 / 5 / 3, and nothing said that the first group is 93% of the file.
function groupAggregate(rows, groupCol, numCol) {
  if (!groupCol) return null;
  const groups = {};
  rows.forEach(r => { const v = r[groupCol] || "(ว่าง)"; (groups[v] = groups[v] || []).push(r); });
  const total = rows.length;
  const out = Object.entries(groups).map(([name, members]) => {
    const g = { name, count: members.length, pct: total ? members.length / total * 100 : 0 };
    if (numCol) {
      const nums = members.map(r => (r[numCol] || "").trim()).filter(v => v !== "" && !isNaN(Number(v))).map(Number);
      g.numCount = nums.length;
      g.sum = nums.length ? nums.reduce((s, v) => s + v, 0) : null;
      g.avg = nums.length ? g.sum / nums.length : null;
    }
    return g;
  });
  // by total when there is one, otherwise by row count — the largest contributor first either way
  return { total, numCol: numCol || null,
    groups: out.sort((a, b) => (numCol ? (b.sum || 0) - (a.sum || 0) : 0) || b.count - a.count) };
}

// Values that differ only by surrounding spaces or letter case, e.g. High / high / HIGH / "High ".
// This is the one data-quality check kept from the cancelled readiness plan, because it is not a
// nicety: the grouping table counts what is written, so four spellings of one level render as four
// groups and the reader sees a split that does not exist in the business.
//
// ⛔ Folds case and whitespace ONLY. parseCSV already trims every field, so in practice it is letter
// case that fires: on F4_dirty_priority.csv the 8 values that reach the table become 4. It also
// leaves "สูง" standing next to "high" although a human reads them as the same level. Folding those
// together needs to know what the words mean, which is the domain-vocabulary hardcoding rule 4
// forbids; trimming and lower-casing is mechanical and holds in any language.
// ⛔ Reports only — the table still counts the values exactly as written. Merging them here would be
// guessing on the user's behalf, the same reason parseCSV reports ragged rows instead of repairing
// them.
function inconsistentValues(rows, col) {
  if (!col) return null;
  const counts = {};
  rows.forEach(r => { const v = r[col]; if (v !== undefined && v !== "") counts[v] = (counts[v] || 0) + 1; });
  const written = Object.keys(counts);
  const folded = {};
  written.forEach(v => { const k = v.trim().toLowerCase(); (folded[k] = folded[k] || []).push(v); });
  const keys = Object.keys(folded);
  if (keys.length === written.length) return null; // nothing folds together — stay silent
  const clusters = keys.filter(k => folded[k].length > 1).map(k => ({
    variants: folded[k].sort((a, b) => counts[b] - counts[a]).map(v => ({ value: v, count: counts[v] })),
    total: folded[k].reduce((s, v) => s + counts[v], 0)
  })).sort((a, b) => b.total - a.total);
  return { col, written: written.length, folded: keys.length, clusters };
}

// The ranked table answers "which rows are at the top" and says nothing about the rest of the column.
// Three numbers out of 24 could be far clear of the field or a hair above the middle, and the table
// reads the same either way. min / median / max place them, and the share says how much of the column's
// total they actually account for. Both are arithmetic over the same values the table was built from —
// no sentence is written about whether any of it is good.
function spreadBlock(sorted, col, topCount) {
  const sp = spread(sorted);
  if (!sp) return "";
  let h = `<table style="margin-top:10px"><thead><tr><th>การกระจายของ ${esc(col)}</th><th>ต่ำสุด</th><th>ค่ากลาง</th><th>สูงสุด</th></tr></thead>` +
    `<tbody><tr><td style="color:var(--muted)">จาก ${sp.n} แถวที่เป็นตัวเลข</td><td>${fmtNum(sp.min)}</td><td>${fmtNum(sp.median)}</td><td>${fmtNum(sp.max)}</td></tr></tbody></table>`;
  const share = topCount ? topShare(sorted, topCount) : null;
  if (share) h += `<div class="prose" style="margin-top:8px">${share.k} อันดับแรกรวมกัน ${fmtNum(share.topSum)} จากผลรวมทั้งคอลัมน์ ${fmtNum(sp.sum)} = <b>${share.pct}%</b></div>`;
  return h;
}

/* ---- summarize and extract read every column, not one ----
 * Measured by sending this tool's prompts through a chatbot and uploading the answers: summarize came
 * back with an ID, a category and two or three KPI columns, and printed "22 rows, 5 groups"; extract
 * came back with 12-19 fields per record including exception flags and confidence scores, and printed
 * the first three rows verbatim. Everything the use case is about was in the file and none of it
 * reached the screen. These build the tables that do — all arithmetic, all tables, no sentence that
 * compares one group with another (the F2 lesson in step 2 still holds).
 */
const MEANS_MAX = 4;          // numeric columns in the per-group means table before it stops fitting
const EXTRACT_TEXT_ROWS = 20; // paragraphs listed in the text-extract table before it is capped
function isNumberText(v) { const s = String(v == null ? "" : v).trim(); return s !== "" && !isNaN(Number(s)); }
function outsub(t) { return `<div class="outsub">${t}</div>`; }

// Columns with exactly two written values and not numbers. In the chatbot answers these were the
// exception and review flags every time (exception_case, human_review_flag, absentee_case), which is
// the part of a use case a reviewer asks about first. A 0/1 column is left to the numeric table.
function flagColumns(cols, rows) {
  const n = rows.length;
  return cols.filter(c => {
    const v = rows.map(r => String(r[c] == null ? "" : r[c]).trim()).filter(x => x !== "");
    return v.length >= n * 0.6 && new Set(v).size === 2 && v.filter(isNumberText).length / v.length < 0.9;
  });
}
function flagTable(cols, rows) {
  const flags = flagColumns(cols, rows), n = rows.length;
  if (!flags.length) return "";
  return `<div class="tscroll"><table style="margin-top:6px"><thead><tr><th>คอลัมน์ที่มี 2 ค่า</th><th>ค่า</th><th>จำนวน</th><th>% ของทั้งหมด</th></tr></thead><tbody>` +
    flags.map(c => {
      const cnt = {}; rows.forEach(r => { const v = String(r[c] == null ? "" : r[c]).trim(); if (v) cnt[v] = (cnt[v] || 0) + 1; });
      // the rarer value first — that is the exception, and the reason the column is worth a row here
      return Object.entries(cnt).sort((a, b) => a[1] - b[1] || (a[0] < b[0] ? -1 : 1)).map(([v, k], i) =>
        `<tr>${i === 0 ? `<td rowspan="2" style="font-weight:600">${esc(c)}</td>` : ""}<td>${esc(v)}</td><td>${k}</td><td>${fmtNum(k / n * 100)}%</td></tr>`).join("");
    }).join("") + `</tbody></table></div>`;
}
// min / median / max for every numeric column, one row each
function numericSpreadTable(cols, rows) {
  const numCols = listNumericColumns(cols, rows);
  if (!numCols.length) return "";
  return `<div class="tscroll"><table style="margin-top:6px"><thead><tr><th>คอลัมน์ตัวเลข</th><th>แถวที่มีค่า</th><th>ต่ำสุด</th><th>ค่ากลาง</th><th>สูงสุด</th></tr></thead><tbody>` +
    numCols.map(c => { const sp = spread(columnNumbers(rows, c)); return `<tr><td style="font-weight:600">${esc(c)}</td><td>${sp.n}</td><td>${fmtNum(sp.min)}</td><td>${fmtNum(sp.median)}</td><td>${fmtNum(sp.max)}</td></tr>`; }).join("") +
    `</tbody></table></div>`;
}
// Mean of each numeric column per group, as cells. ⛔ No sentence is written from it: on the random
// F2 file the per-group means differ by noise, and a sentence would present that noise as a finding.
function groupMeansTable(cols, rows, g) {
  const all = listNumericColumns(cols, rows), numCols = all.slice(0, MEANS_MAX);
  if (!g || !numCols.length) return "";
  const aggs = numCols.map(c => groupAggregate(rows, g, c));
  const byName = a => { const m = {}; a.groups.forEach(x => m[x.name] = x); return m; };
  const maps = aggs.map(byName);
  const order = groupAggregate(rows, g, null).groups;
  return `<div class="tscroll"><table style="margin-top:6px"><thead><tr><th>${esc(g)}</th><th>จำนวน</th>${numCols.map(c => `<th>เฉลี่ย ${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
    order.map(x => `<tr><td style="font-weight:600">${esc(x.name)}</td><td>${x.count}</td>${maps.map(m => `<td>${fmtNum(m[x.name].avg)}</td>`).join("")}</tr>`).join("") +
    `</tbody></table></div>` +
    (all.length > numCols.length ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">แสดง ${numCols.length} คอลัมน์ตัวเลขแรก จากทั้งหมด ${all.length} คอลัมน์</div>` : ``);
}
function summarizeCSVBlocks(cols, rows, g) {
  if (!rows.length) return `<div class="prose">(ไฟล์นี้ไม่มีข้อมูล)</div>`;
  const numCols = listNumericColumns(cols, rows), agg = g ? groupAggregate(rows, g, null) : null;
  let h = `<div class="metric-row"><div class="metric"><div class="n">${rows.length}</div><div class="l">รายการทั้งหมด</div></div>` +
    (agg ? `<div class="metric"><div class="n">${agg.groups.length}</div><div class="l">กลุ่มใน ${esc(g)}</div></div>` : ``) +
    `<div class="metric"><div class="n">${numCols.length}</div><div class="l">คอลัมน์ตัวเลข</div></div></div>`;
  if (agg) h += outsub("แต่ละกลุ่มมีกี่รายการ") +
    `<div class="tscroll"><table style="margin-top:6px"><thead><tr><th>${esc(g)}</th><th>จำนวน</th><th>% ของทั้งหมด</th></tr></thead><tbody>` +
    agg.groups.map(x => `<tr><td style="font-weight:600">${esc(x.name)}</td><td>${x.count}</td><td>${fmtNum(x.pct)}%</td></tr>`).join("") + `</tbody></table></div>`;
  const sp = numericSpreadTable(cols, rows); if (sp) h += outsub("ตัวเลขในไฟล์กระจายตัวแค่ไหน") + sp;
  const gm = groupMeansTable(cols, rows, g); if (gm) h += outsub("ค่าเฉลี่ยของแต่ละกลุ่ม") + gm;
  const ft = flagTable(cols, rows); if (ft) h += outsub("คอลัมน์ที่มีแค่ 2 ค่า — มักเป็นธงข้อยกเว้นหรือสถานะ") + ft;
  if (!agg && !sp && !ft) h += `<div class="prose">จากข้อมูล ${rows.length} รายการ ไม่มีคอลัมน์ที่จัดกลุ่มได้ ไม่มีคอลัมน์ตัวเลข และไม่มีคอลัมน์ 2 ค่า — ไฟล์นี้จึงสรุปได้แค่จำนวนรายการ</div>`;
  return h;
}

// What each extracted field turned out to hold, read off its values. "-" counts as empty because
// that is how every chatbot answer in the round trips wrote "nothing here".
const FIELD_TIME = /^\d{1,2}:\d{2}(:\d{2})?$/;
function fieldProfile(cols, rows) {
  const n = rows.length;
  return cols.map(c => {
    const filled = rows.map(r => String(r[c] == null ? "" : r[c]).trim()).filter(v => v !== "" && !isEmptyMark(v));
    const uniq = new Set(filled).size, k = filled.length;
    const share = test => k ? filled.filter(test).length / k : 0;
    let type;
    if (share(v => FIELD_TIME.test(v)) >= 0.9) type = "เวลา";
    else if (share(v => !!dateKey(v)) >= 0.9) type = "วันที่";
    else if (share(isNumberText) >= 0.9) type = "ตัวเลข";
    else if (k >= n * 0.9 && uniq === k) type = "รหัส (ไม่ซ้ำทุกแถว)";
    else if (uniq === 2) type = "มี 2 ค่า";
    else if (uniq >= 3 && uniq <= 8 && uniq / k <= 0.7) type = "หมวดหมู่";
    else type = "ข้อความ";
    return { col: c, type, filled: k, total: n, examples: [...new Set(filled)].slice(0, 3) };
  });
}
function extractCSVBlocks(cols, rows) {
  const r = computeExtract(cols, rows);
  if (!r) return `<div class="box box-gray">ไฟล์นี้ไม่มีข้อมูลให้สกัด</div>`;
  const prof = fieldProfile(cols, rows);
  let h = `<div class="metric-row"><div class="metric"><div class="n">${rows.length}</div><div class="l">รายการที่สกัดได้</div></div>` +
    `<div class="metric"><div class="n">${cols.length}</div><div class="l">ฟิลด์ต่อรายการ</div></div>` +
    `<div class="metric"><div class="n">${prof.filter(p => p.filled === p.total).length}/${cols.length}</div><div class="l">ฟิลด์ที่มีค่าครบทุกแถว</div></div></div>`;
  h += outsub("ฟิลด์ที่ได้ — ประเภทที่ตรวจพบจากค่าในคอลัมน์ และมีค่ากี่แถว") +
    `<div class="tscroll"><table style="margin-top:6px"><thead><tr><th>ฟิลด์</th><th>ประเภท</th><th>มีค่า</th><th>ตัวอย่างค่า</th></tr></thead><tbody>` +
    // field names and sample values are often one long unbroken token (extracted_amount_thb), which
    // pushed this table 15px past a 375px screen — both cells may break anywhere
    prof.map(p => `<tr><td style="font-weight:600;overflow-wrap:anywhere">${esc(p.col)}</td><td>${p.type}</td><td${p.filled < p.total ? ` style="color:var(--amber);font-weight:600"` : ``}>${p.filled}/${p.total}</td>` +
      `<td style="color:var(--muted);overflow-wrap:anywhere">${p.examples.map(v => esc(v.length > 28 ? v.slice(0, 28) + "…" : v)).join(" · ")}</td></tr>`).join("") + `</tbody></table></div>`;
  const ft = flagTable(cols, rows); if (ft) h += outsub("คอลัมน์ที่มีแค่ 2 ค่า — มักเป็นธงข้อยกเว้นหรือรายการที่ต้องตรวจ") + ft;
  const sp = numericSpreadTable(cols, rows); if (sp) h += outsub("ฟิลด์ตัวเลข") + sp;
  h += outsub("ตัวอย่างรายการ") + `<div class="tscroll"><table style="margin-top:6px"><tbody>` +
    r.sample[0].map(([k, v]) => `<tr><td style="font-weight:600;width:35%">${esc(k)}</td><td>${esc(v)}</td></tr>`).join("") + `</tbody></table></div>` + capNote(1, r.total);
  return h;
}
// Per paragraph: the numbers and the upper-case abbreviations keywords() already finds. Shapes, not
// meanings — the same extraction in any language and any domain (rule 4).
function extractTextBlocks(paras) {
  if (!paras.length) return `<div class="box box-gray">ไฟล์นี้ไม่มีข้อมูลให้สกัด</div>`;
  const rowsX = paras.map((p, i) => {
    const head = p.split("\n")[0], kw = [...keywords(p)];
    return { i: i + 1, head: head.length > 60 ? head.slice(0, 60) + "…" : head, nums: kw.filter(k => /^\d/.test(k)), codes: kw.filter(k => /^[A-Z]/.test(k)) };
  });
  const shown = rowsX.slice(0, EXTRACT_TEXT_ROWS);
  const pills = (a, max) => a.slice(0, max).map(v => `<span class="pill pill-neu">${esc(v)}</span>`).join(" ") + (a.length > max ? ` +${a.length - max}` : ``);
  return `<div class="metric-row"><div class="metric"><div class="n">${paras.length}</div><div class="l">ย่อหน้า/รายการ</div></div>` +
    `<div class="metric"><div class="n">${rowsX.reduce((s, r) => s + r.nums.length, 0)}</div><div class="l">ตัวเลขที่พบ</div></div>` +
    `<div class="metric"><div class="n">${new Set(rowsX.flatMap(r => r.codes)).size}</div><div class="l">ตัวย่อ/รหัสที่พบ</div></div></div>` +
    outsub("แต่ละย่อหน้าได้อะไรออกมา — ดึงตามรูปแบบ (ตัวเลข · ตัวย่อภาษาอังกฤษ) ไม่ได้อ่านความหมาย") +
    `<div class="tscroll"><table style="margin-top:6px"><thead><tr><th>#</th><th>หัวข้อ (บรรทัดแรก)</th><th>ตัวเลข</th><th>ตัวย่อ/รหัส</th></tr></thead><tbody>` +
    shown.map(r => `<tr><td>${r.i}</td><td>${esc(r.head)}</td><td>${pills(r.nums, 6)}</td><td>${pills(r.codes, 4)}</td></tr>`).join("") + `</tbody></table></div>` +
    (rowsX.length > shown.length ? capNote(shown.length, rowsX.length) : ``);
}

// How one row is named in the classify "ตัวอย่าง" and recommend "รายการ" cells. Both used to join every
// column with " · " and no column names — on chatbot answers that was 9 to 14 bare values per row, and
// nothing said which number was the value, the score or the days. Now a row reads as its key and one
// line of text, and opens to every field by name. Chosen by shape, not by column name (rule 4):
//   key   — the first column filled and different in every row
//   label — of the remaining columns that are free text (not numbers, not a grouping column, not
//           dates), the one whose values are longest on average: a name or a description, not a code
// On the chatbot answers this picked SKU_ID + Product_Name, PR_ID + Item_Description, Record_ID +
// Action_Taken. Either may be missing; the cell then shows what it has.
function recordFields(cols, rows) {
  const n = rows.length, filled = c => rows.map(r => String(r[c] == null ? "" : r[c]).trim()).filter(v => v !== "" && !isEmptyMark(v));
  const key = cols.find(c => { const v = filled(c); return n > 1 && v.length === n && new Set(v).size === n; }) || null;
  const cat = listCategoricalColumns(cols, rows), num = listNumericColumns(cols, rows);
  const avgLen = c => { const v = filled(c); return v.reduce((a, s) => a + s.length, 0) / (v.length || 1); };
  // The label must read as something without its column name beside it. Checked on every chatbot answer
  // in the full loop (34 files): the longest column was often a time window, a date-time or a percent
  // ("06:00-10:00", "2026-06-01 06:12", "15%"), shown after the key as if it described the row. Those
  // are left out — a column where half the values are dates, or carry fewer than 3 letters, or one
  // value repeated throughout. Names that repeat ("Vendor A Supply") stay; they read fine alone.
  // Owner chose this middle rule over the stricter one, which also dropped codes and repeated names.
  const letters = s => (String(s).match(/\p{L}/gu) || []).length;
  const text = cols.filter(c => {
    if (c === key || cat.indexOf(c) !== -1 || num.indexOf(c) !== -1) return false;
    const v = filled(c); if (v.length < n * 0.6) return false;
    const share = f => v.filter(f).length / v.length;
    return share(dateKey) < 0.5 && share(s => letters(s) < 3) < 0.5 && new Set(v).size >= 2;
  });
  let label = null;
  text.forEach(c => { if (label === null || avgLen(c) > avgLen(label)) label = c; });
  return { key, label };
}
// One row as a cell: key and label on one line, every other field (except `skip`, already its own
// column in the table) behind a <details>, by column name. Kept as data so the tests can read it.
function recordCell(r, cols, rf, skip) {
  const val = c => String(r[c] == null ? "" : r[c]).trim();
  return { key: rf.key ? val(rf.key) : "", label: rf.label ? val(rf.label) : "",
    fields: cols.filter(c => c !== skip && c !== rf.key && c !== rf.label).map(c => [c, val(c)]) };
}
// sequential — one linked pair per row. The document cell opens on the stretch of the paragraph that
// holds the shared text, marked, because the first line of a paragraph (what it used to show, cut at
// 130) usually repeated the key and stopped before the part that made the link; the whole paragraph is
// one click away. The last cell says which kind of link it is — the phrases themselves are the marks.
function reconcileTable(links) {
  return `<div class="tscroll"><table><thead><tr><th>รายการ</th><th>เอกสารที่เชื่อม</th><th>จับคู่ด้วย</th></tr></thead><tbody>` +
    links.map(l => {
      const w = snippetAround(l.para, l.spans, 150);
      const snip = (w.start > 0 ? "…" : "") + markSpans(l.para, l.spans, w.start, w.end) + (w.end < l.para.length ? "…" : "");
      const doc = w.start > 0 || w.end < l.para.length
        ? `<details class="rowcell"><summary>${snip}</summary><div class="docfull">${markSpans(l.para, l.spans, 0, l.para.length)}</div></details>`
        : `<div class="rowcell">${snip}</div>`;
      const how = l.byId ? `<span class="pill pill-ok">รหัสตรงกัน</span>`
        : `<span class="pill pill-neu">เนื้อหาคล้ายกัน</span>` + (l.spans.length ? `<div class="howsub">${l.spans.length} ช่วงที่ตรงกัน — ไฮไลต์ในเอกสาร</div>` : ``);
      return `<tr><td>${recordCellHtml(l.cell)}</td><td>${doc}<div class="docsrc">${esc(l.src)} · ย่อหน้า ${l.pi + 1}</div></td><td>${how}</td></tr>`;
    }).join("") + `</tbody></table></div>`;
}
function recordCellHtml(c) {
  const lab = cut(c.label, 70);
  let head = (c.key ? `<b>${esc(c.key)}</b>` : ``) + (c.key && lab.text ? ` ` : ``) + esc(lab.text) + (lab.more ? `…` : ``);
  // neither a key nor a label in this file: name the row by its first field rather than show nothing
  if (!head && c.fields.length) head = `<span style="color:var(--muted)">${esc(c.fields[0][0])}:</span> ${esc(c.fields[0][1] || "—")}`;
  if (!c.fields.length) return `<div class="rowcell">${head}</div>`;
  return `<details class="rowcell"><summary>${head}</summary><table>` +
    (lab.more ? `<tr><td>ข้อความเต็ม</td><td>${esc(c.label)}</td></tr>` : ``) +
    c.fields.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v === "" || isEmptyMark(v) ? `<span style="color:var(--faint)">—</span>` : esc(v)}</td></tr>`).join("") +
    `</table></details>`;
}

// `want` is the column the user picked, when they picked one; falling back to the automatic choice
// keeps every existing caller and test working unchanged.
function computeClassify(cols, rows, want) {
  const groupCol = (want && cols.indexOf(want) !== -1) ? want : findCategoricalColumn(cols, rows);
  if (!groupCol) return null;
  const groups = {};
  rows.forEach(r => { const v = r[groupCol] || "(ว่าง)"; (groups[v] = groups[v] || []).push(r); });
  const sorted = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
  const rf = recordFields(cols, rows);
  return {
    groupCol,
    groups: sorted.map(([name, members]) => ({
      name, count: members.length,
      sample: members.slice(0, PREVIEW_CAP).map(r => recordCell(r, cols, rf, groupCol))
    }))
  };
}

function computeRecommend(cols, rows, want) {
  const col = (want && cols.indexOf(want) !== -1) ? want : findNumericColumn(cols, rows);
  if (!col) return null;
  const rf = recordFields(cols, rows);
  const ranked = rows
    .filter(r => {
      const trimmed = (r[col] || "").trim();
      return trimmed !== "" && !isNaN(Number(trimmed));
    })
    .map(r => ({ val: Number(r[col]), row: recordCell(r, cols, rf, col) }))
    .sort((a, b) => b.val - a.val);
  if (!ranked.length) return null;
  return { col, total: ranked.length, top: ranked.slice(0, PREVIEW_CAP) };
}

function computeForecast(cols, rows, want) {
  const col = (want && cols.indexOf(want) !== -1) ? want : findNumericColumn(cols, rows);
  if (!col) return null;
  const vals = rows
    .map(r => (r[col] || "").trim())
    .filter(v => v !== "" && !isNaN(Number(v)))
    .map(Number);
  if (vals.length < 4) return null;
  const mid = Math.floor(vals.length / 2);
  const firstHalf = vals.slice(0, mid), secondHalf = vals.slice(mid);
  const avg = arr => arr.reduce((s, v) => s + v, 0) / arr.length;
  const firstAvg = avg(firstHalf), secondAvg = avg(secondHalf);
  const pct = firstAvg === 0 ? null : Math.round(((secondAvg - firstAvg) / Math.abs(firstAvg)) * 100);
  // `series` is the exact array the halves were cut from, in file order — the chart draws this and
  // nothing else, so what it shows and what the percentage was computed from cannot drift apart
  return { col, firstAvg, secondAvg, pct, series: vals };
}

function computeGenerateSkeleton(biz) {

    { label: "จุดประสงค์ (จาก \"AI จะช่วยอย่างไร\")", value: biz.aiHelp || "—", real: true },
    { label: "ผลลัพธ์ที่คาดหวัง", value: biz.expectedBenefit || "—", real: true },

// [P4-5] precondition check for a chatbot mock-up file — differs on purpose from the renderStructuredFallback
// ladder above: that ladder exists for whatever shape the uploaded file actually has, which we don't
// control, so it degrades quietly and politely. A mock-up file comes from a prompt THIS TOOL wrote
// (buildPrompt()) — if it doesn't fit, the prompt or the chatbot slipped, and the user can fix it in
// about a minute by re-running the downloaded prompt. So this names the gap plainly instead of degrading
// silently. Reuses the same detectors the renderers use (findCategoricalColumn/findNumericColumn) so the
// check always agrees with what actually renders. null = nothing to say: no files yet.
function checkMockPrecondition(cat, files) {
  if (!files || !files.length || !files.some(f => f.simulated)) return null;
  const say = missing => `⚠️ ไฟล์คำตอบจาก AI chatbot ไม่ตรงกับที่หมวดนี้ต้องการ: ${missing} — ลองรัน Prompt (.md) ที่ดาวน์โหลดไว้ซ้ำใน AI chatbot ของคุณ (อาจเป็นเพราะ Prompt หรือคำตอบคลาดเคลื่อน แก้ได้ในไม่ถึงนาที)`;
  const simFiles = files.filter(f => f.simulated);

  // spec §6 ("ไฟล์ว่าง / parse ไม่ได้ → ข้อความบอกตรงๆ") + spec §9 risk 2 (code fences "เกิดแน่นอน" —
  // the precondition check "ต้องเจอ"). Both apply across EVERY category, not just classify/recommend/
  // forecast/sequential below — an empty .txt for summarize/extract/search_qa previously produced no
  // message at all, and a fenced CSV parsed as one bogus column instead of failing loudly. Checked here,
  // before any category branch, and blocking: naming the real cause beats a category-specific message
  // that blames the wrong thing (e.g. classify reporting "no categorical column" for a fenced file).
  // We warn only — never strip the fence ourselves, since that would be the tool guessing at the
  // user's data, which this product does not do.
  const empty = simFiles.filter(f => !f.text || !f.text.trim());
  if (empty.length) return `⚠️ อ่านไฟล์คำตอบจาก AI chatbot ไม่ได้ — ไฟล์ว่างเปล่า: ${empty.map(f => f.name).join(", ")} — ตรวจว่าคัดลอก/บันทึกเนื้อหาคำตอบมาครบก่อนอัปโหลด หรือลองรัน Prompt (.md) ที่ดาวน์โหลดไว้ซ้ำ`;
  const fenced = simFiles.filter(f => /^\s*```/.test(f.text));
  if (fenced.length) return `⚠️ ไฟล์คำตอบจาก AI chatbot มี code fence (\`\`\`) ครอบอยู่ — เครื่องมือนี้จะไม่ลบให้อัตโนมัติเพราะไม่อยากเดาใจข้อมูลของท่าน กรุณาเปิดไฟล์แล้วลบบรรทัด \`\`\` ที่ครอบอยู่ด้านบน/ล่างออกเอง แล้วอัปโหลดใหม่: ${fenced.map(f => f.name).join(", ")}`;

  const csvFiles = files.filter(f => f.isCSV);
  if (cat === "classify" || cat === "recommend" || cat === "forecast") {
    // any qualifying CSV is enough — the renderers (computeClassify/computeRecommend/computeForecast)
    // iterate EVERY csv file independently and fall back per-file, so a check keyed on csvFiles[0] alone
    // could disagree with what actually renders: it could raise a false alarm when file 1 fails but file
    // 2 would render fine, or say nothing when file 1 passes but file 2 silently falls back. Checking
    // "does at least one file qualify" is the only version that agrees with the renderer in both directions.
    if (!csvFiles.length) return say("ต้องเป็นไฟล์ CSV");
    const qualifies = cat === "classify"
      ? f => { const { cols, rows } = parseCSV(f.text); return !!findCategoricalColumn(cols, rows); }
      : cat === "forecast"
        // the forecast prompt asks for a time series, so an answer without a period column did not follow it
        ? f => { const { cols, rows } = parseCSV(f.text); return !!findNumericColumn(cols, rows) && listTimeColumns(cols, rows).length > 0; }
        : f => { const { cols, rows } = parseCSV(f.text); return !!findNumericColumn(cols, rows); };
    if (!csvFiles.some(qualifies)) {
      return cat === "classify"
        ? say("ไม่มีคอลัมน์ที่เหมาะเป็นหมวดหมู่ (ค่าไม่ซ้ำมากเกินไปและไม่ใช่รหัสเฉพาะแถว)")
        : cat === "forecast"
          ? say("ต้องเป็นอนุกรมเวลา — มีคอลัมน์ช่วงเวลาแบบ 2025-01 (1 แถวต่อ 1 ช่วง) และคอลัมน์ตัวเลข")
          : say("ไม่มีคอลัมน์ตัวเลขที่เหมาะสม");
    }
    return null;
  }
  if (cat === "sequential") {
    if (!(files.some(f => f.isCSV) && files.some(f => !f.isCSV))) return say("ต้องมีทั้งไฟล์ CSV และไฟล์เอกสาร (.txt) เป็นคู่ — เลือกทั้งสองไฟล์พร้อมกันในการอัปโหลดครั้งเดียว");
    return null;
  }
  return null; // search_qa/summarize/extract/generate/unknown accept any file shape — no extra contract to enforce
}

function renderOutput(){
  const {cat:ucCat,tt,steps,datasets}=window._ucCtx;
  // everything below renders the CHOSEN format (step 0), which the downloadable Prompt now follows too;
  // ucCat stays the UC's own category
  const cat=effectiveCat(ucCat);
  const out=document.getElementById("output"); if(!out) return;
  // an agent/decide UC before its format is chosen: nothing to render yet
  if(!cat){ out.innerHTML=`<div class="box box-gray" style="font-size:13px">เลือกรูปแบบในขั้น 0 ด้านบน แล้วตัวอย่าง Output จะแสดงที่นี่</div>`; return; }
  // A format with no data contract (generate/unknown) never reads files — an upload made under another
  // format stays in window._files for when the user switches back, but must not stamp "simulated"
  // onto output that was built from the workshop fields alone.
  const allFiles=window._files||[], files=catContract(cat)?allFiles:[];
  const hasFiles=files.length>0;
  // which format's Prompt the uploaded files answered (null when files were set without an upload)
  const fc=window._filesCat||null, fromOther=hasFiles && !!fc && fc!==cat;
  let h="";
  if(allFiles.length && !files.length)
    h+=`<div class="box box-gray" style="margin-bottom:12px;font-size:13px">ไฟล์ที่อัปโหลดไว้ไม่ได้ใช้กับรูปแบบนี้ — รูปแบบนี้แสดงเฉพาะโครงจากข้อมูล Use Case</div>`;

  // Files made by the Prompt of another format: say which, and the way on — download the new Prompt.
  // That way on now exists, because the Prompt follows the pick. Otherwise, a chosen format that needs
  // a file kind the upload lacks is named, and the choice stays available (a missing input is named,
  // not taken away).
  if(fromOther){
    h+=`<div class="box box-amber" style="margin-bottom:12px;font-size:13px">ไฟล์ที่อัปไว้สร้างจาก Prompt แบบ <b>${esc(CAT_PICKER_LABEL[fc]||fc)}</b> — แบบที่เลือกตอนนี้ (${esc(CAT_PICKER_LABEL[cat])}) ต้องใช้ ${esc(catContract(cat).need.replace(/<[^>]+>/g,""))}`+
      `<div style="color:var(--ink);margin-top:4px">ดาวน์โหลด Prompt ใหม่ในขั้นที่ 1 ด้านบน แล้วอัปโหลดคำตอบใหม่</div></div>`;
  } else {
    const need=catContract(cat);
    if(need && hasFiles){
      const miss=[];
      if(need.pair && !files.some(f=>f.isCSV)) miss.push("ไฟล์ CSV");
      if(need.pair && !files.some(f=>!f.isCSV)) miss.push("ไฟล์ข้อความ (.txt/.md)");
      if(!need.pair && need.exts.length===1 && need.exts[0]===".csv" && !files.some(f=>f.isCSV)) miss.push("ไฟล์ CSV");
      if(miss.length) h+=`<div class="box box-amber" style="margin-bottom:12px;font-size:13px">`+
        `แบบที่เลือกต้องใช้ ${esc(need.need.replace(/<[^>]+>/g,""))} — ตอนนี้ยังขาด <b>${miss.join(" และ ")}</b>`+
        `<div style="color:var(--muted);margin-top:4px">อัปโหลดเพิ่มได้เลย หรือเลือกแบบอื่นที่ใช้ไฟล์ที่มีอยู่แล้ว</div></div>`;
    }
  }

  // a refused file must say which file and why: without this the screen simply does not change and
  // the user concludes the upload worked. Persisted (not one-shot) so the reason stays on screen next
  // to the output it explains, and cleared by renderUC() with window._files.
  const rejects=window._fileRejects||[];
  if(rejects.length){
    h+=`<div class="box box-red" style="margin-bottom:12px"><b>⚠️ ไฟล์ที่ใช้ไม่ได้ (${rejects.length})</b>`+
      `<ul style="margin:6px 0 0;padding-left:18px">`+rejects.map(r=>`<li><b>${esc(r.name)}</b> — ${esc(r.reason)}</li>`).join("")+`</ul></div>`;
  }

  // name + size of what actually fed the numbers below — the same provenance question item 6 asks,
  // answered once at the top rather than repeated per renderer.
  if(hasFiles){
    h+=`<div class="box box-gray" style="margin-bottom:12px;font-size:13px"><b>ไฟล์ที่ใช้คำนวณ (${files.length})</b> · `+
      files.map(f=>esc(f.name)+(formatBytes(f.size)?" ("+formatBytes(f.size)+")":"")).join(" · ")+`</div>`;
  }

  // Rows whose field count did not match the header. Shown above every renderer because a shifted
  // column corrupts whatever is computed next, not just one operation. Says what happened to them; does
  // not offer to repair the file (see parseCSV).
  if(hasFiles){
    const sh=files.reduce((n,f)=>n+(f.isCSV?parseCSV(f.text).short:0),0);
    const lo=files.reduce((n,f)=>n+(f.isCSV?parseCSV(f.text).long:0),0);
    if(sh||lo) h+=`<div class="box box-red" style="margin-bottom:12px;font-size:13px">`+
      `<b>${sh+lo} แถวมีจำนวนช่องไม่ตรงกับหัวตาราง</b>`+
      `<div style="margin-top:4px">`+
      (sh?`ขาดช่อง ${sh} แถว — ช่องที่ขาดถูกอ่านเป็นค่าว่าง`:``)+(sh&&lo?` · `:``)+
      (lo?`เกินช่อง ${lo} แถว — ค่าที่เกินถูกตัดทิ้ง`:``)+
      `<div style="color:var(--muted);margin-top:4px">ตัวเลขทั้งหมดด้านล่างคำนวณจากไฟล์ที่อ่านได้แบบนี้</div></div></div>`;
  }

  // provenance banner — every uploaded file comes from a chatbot answer now (real-data upload was
  // removed), so this shows on every render once a file is active; it never touches the computation below.
  if(files.some(f=>f.simulated)){
    h+=`<div class="box box-amber" style="border:2px solid #d97706;margin-bottom:12px">
      ⚠️ <b>ตัวอย่างจำลองจาก AI chatbot ภายนอก</b> · ไม่ใช่ข้อมูลจริงของท่าน · ตัวเลขไม่ได้นับจากไฟล์ของท่าน · ใช้ดูรูปแบบเท่านั้น</div>`;
    // [P4-5] precondition message — visually distinct from the banner above, and never suppresses
    // the renderer output below: the user should still see whatever the renderer could manage.
    // Checked against the format whose Prompt made the files. This message tells the user to re-run
    // that Prompt, which can only help when it is the Prompt of the format on screen: when the Prompt
    // stayed with the UC's category, checking the chosen format was a dead end (I3 — "forecast" on an
    // agent UC demanded a numeric column the sequential prompt never asks for). Files from another
    // format's Prompt get the "download the new Prompt" box above instead.
    const precheck = fromOther ? null : checkMockPrecondition(cat, files);
    if (precheck) h += `<div class="box box-red" style="margin-bottom:12px">${esc(precheck)}</div>`;
  }

  if(cat==="search_qa"){
    h+=`<h3>ค้นหา / ถามตอบ</h3>`;
    h+=`<input type="text" id="q" placeholder="พิมพ์คำถามหรือคำค้น…" style="margin-bottom:8px" onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()">ค้นหา</button><div id="qres" style="margin-top:12px"></div>`;
    // after an upload the box used to sit empty with nothing to say what it would search
    if(hasFiles){
      // ...and then with only a count it still looked like nothing had happened (found in the full loop,
      // all 15 search UCs). Owner chose option B: say what the file holds — the first few units, as a
      // search would see them — and what to type. No search is run for the user.
      const units=searchUnits(files), word=searchUnitWord(files);
      h+=`<div class="box box-gray" id="qhint" style="margin-top:8px;font-size:13px">ไฟล์ที่อัปโหลดมี <b>${units.length} ${word}</b>`+
        (files.length>1?` จาก ${files.length} ไฟล์`:``)+(units.length?` — ตัวอย่าง ${Math.min(5,units.length)} ${word}แรก:`:``)+
        (units.length?`<ol class="qprev">`+units.slice(0,5).map(u=>{const c=cut(u.t.split("\n")[0],90);return `<li>${esc(c.text)}${c.more?"…":""}</li>`;}).join("")+`</ol>`:``)+
        `<div style="margin-top:6px;color:var(--muted)">พิมพ์คำค้นในช่องด้านบนแล้วกด Enter เช่น ชื่อระบบ รหัสเอกสาร หรืออาการที่พบ · คำไทยพิมพ์ติดกันได้ ไม่ต้องเว้นวรรค</div></div>`;
    }
    else h+=sampleShape("search_qa");
  }
  else if(cat==="summarize"){
    h+=`<h3>สรุปข้อมูล</h3>`;
    if(hasFiles){
      files.forEach(f=>{
        if(f.isCSV){
          const {cols,rows}=parseCSV(f.text);
          const avail=listCategoricalColumns(cols,rows);
          const want=pickedCol("group",avail);
          h+=columnPicker("group","แบ่งกลุ่มตามคอลัมน์",avail,want);
          h+=`<div style="margin-bottom:14px"><div style="font-size:13px;color:var(--muted);margin-bottom:4px">${esc(fileLabel(f))}</div>`+
            summarizeCSVBlocks(cols,rows,want)+`</div>`;
          return;
        }
        const s=summarizeFile(f.name,f.text,false);
        h+=`<div style="margin-bottom:14px"><div style="font-size:13px;color:var(--muted);margin-bottom:4px">${esc(fileLabel(f))}</div>`;
        if(s.metrics&&s.metrics.length){h+=`<div class="metric-row">`+s.metrics.map(m=>`<div class="metric"><div class="n">${m[1]}</div><div class="l">${esc(m[0])}</div></div>`).join("")+`</div>`;}
        h+=`<div class="prose">${esc(s.prose)}</div></div>`;
      });
    } else {
      h+=sampleShape("summarize");
    }
  }
  else if(cat==="sequential"){
    h+=`<h3>เทียบ/รวบรวมเอกสาร</h3>`;
    // step narrative moved to the universal As-is/To-be flow diagram (renderFlowDiagram, called from renderUC())
    // reconciliation or structured extract from files
    if(hasFiles){
      const csvFile=files.find(f=>f.isCSV);
      if(csvFile && files.some(f=>!f.isCSV)){
        const idCols=parseCSV(csvFile.text).cols;
        h+=columnPicker("id","คอลัมน์รหัสที่ใช้จับคู่",idCols,pickedCol("id",idCols,guessCol(idCols,["id","รหัส","เลข","code"])||idCols[0]));
      }
      const rec=reconcile(files,(window._colPick||{}).id);
      if(rec&&rec.length){
        // one count everywhere: the heading, the cap line and the coverage box all read matchedRows.
        // The heading used to print rec.length, which is the internal slice of 8, beside a coverage box
        // saying 12 of 12 and a table showing 3.
        h+=`<h3>ผลการเทียบข้ามเอกสาร (${rec.matchedRows} คู่ที่เชื่อมโยงได้)</h3>`+reconcileTable(rec.slice(0,PREVIEW_CAP))+
          capNote(Math.min(rec.length,PREVIEW_CAP), rec.matchedRows);
        // Coverage — how many rows found any candidate at all, out of how many were read. Deliberately
        // worded as "found a linked document", not "matched correctly": the tool can prove a row has a
        // counterpart with shared content, it cannot prove the counterpart is the right one, and on a
        // document set from one domain this figure will often sit at 100%. Saying more than that would
        // be the fabrication the product exists not to do.
        if(rec.totalRows){
          const left=rec.totalRows-rec.matchedRows;
          h+=`<div class="box box-gray" style="margin-top:10px;font-size:13px">`+
            `<b>ความครอบคลุม:</b> พบเอกสารที่เชื่อมโยงได้ <b>${rec.matchedRows} จาก ${rec.totalRows} แถว</b> `+
            `(${Math.round(rec.matchedRows/rec.totalRows*100)}%)`+
            (left>0?` · อีก <b>${left} แถว</b>ไม่พบเอกสารที่มีเนื้อหาร่วมกันเลย ต้องตรวจเอง`:``)+
            // the two kinds of link carry different weight, so they are counted apart: a key match is
            // a document that names the row; a content match is only a document that resembles it
            (rec.idRows?`<div style="margin-top:4px">จับคู่ด้วย<b>รหัสที่เขียนอยู่ในเอกสาร ${rec.idRows} แถว</b>`+
              (rec.matchedRows-rec.idRows>0?` · จับคู่จากเนื้อหาที่คล้ายกัน ${rec.matchedRows-rec.idRows} แถว`:``)+`</div>`:``)+
            `<div style="color:var(--muted);margin-top:4px">`+
            (rec.idRows===rec.matchedRows
              ? `ทุกคู่มาจากรหัสที่เอกสารเขียนไว้เอง — ยืนยันว่าเอกสารอ้างถึงแถวนั้น ไม่ได้ยืนยันว่าเนื้อหาในเอกสารถูกต้อง`
              : `คู่ที่จับจากเนื้อหาบอกเพียงว่ามีเอกสารที่เนื้อหาเกี่ยวข้องกัน ไม่ได้ยืนยันว่าคู่ที่จับได้ถูกต้อง — ต้องให้คนตรวจ`)+`</div>`+
            `</div>`;
        }
      } else {
        // fallback: structured extract per file
        h += renderStructuredFallback(files, "ไม่มีคู่ให้เทียบ — แสดงการรวบรวม/จัดโครงแทน");

    } else {
      h+=sampleShape("sequential");
    }
  }
  else if(cat==="extract"){
    h+=`<h3>สกัดข้อมูล</h3>`;
    if(hasFiles){
      files.forEach(f=>{
        h+=`<div style="margin-bottom:14px"><div style="font-size:13px;color:var(--muted);margin-bottom:4px">${esc(fileLabel(f))}</div>`;
        if(f.isCSV){ const {cols,rows}=parseCSV(f.text); h+=extractCSVBlocks(cols,rows); }

  }
  else if(cat==="classify"){
    h+=`<h3>จัดหมวดหมู่</h3>`;
    if(hasFiles){
      const csvFiles=files.filter(f=>f.isCSV);

        h+=renderStructuredFallback(files,"ไฟล์ที่อัปโหลดไม่ใช่ CSV — การจัดหมวดอัตโนมัติต้องใช้ไฟล์ตาราง");
      } else {
        csvFiles.forEach(f=>{
          const {cols,rows}=parseCSV(f.text);

          const want=pickedCol("group",avail);
          h+=columnPicker("group","จัดกลุ่มตามคอลัมน์",avail,want);
          const r=computeClassify(cols,rows,want);
          h+=`<div style="margin-bottom:14px"><div style="font-size:13px;color:var(--muted);margin-bottom:4px">${esc(fileLabel(f))}</div>`;
          if(!r){ h+=renderStructuredFallback([f],"ไฟล์นี้ไม่มีคอลัมน์ที่เหมาะกับการจัดหมวดอัตโนมัติ (ต้องมีคอลัมน์ที่ค่าไม่ซ้ำมากเกินไปและไม่ใช่รหัสเฉพาะแถว)")+`</div>`; return; }
          // Values that differ only in case or surrounding spaces split one real group across several
          // rows of the table below, so this is said before the table, not after it. It names what it
          // found and stops there: the counts stay exactly as the file wrote them.
          const iv=inconsistentValues(rows,r.groupCol);
          if(iv){
            h+=`<div class="box box-amber" style="margin-bottom:10px;font-size:13px">`+
              `<b>คอลัมน์ ${esc(iv.col)} มี ${iv.written} ค่าที่เขียนต่างกัน — ถ้าไม่นับตัวพิมพ์เล็ก/ใหญ่และช่องว่างหัวท้ายจะเหลือ ${iv.folded}</b>`+
              `<div style="margin-top:4px">ตารางด้านล่างนับตามที่เขียนมาจริง จึงแยกเป็นคนละกลุ่ม:</div>`+
              `<ul style="margin:6px 0 0;padding-left:18px">`+
              iv.clusters.map(c=>`<li>${c.variants.map(v=>`<code>${esc(v.value)}</code> ${v.count}`).join(" · ")} → รวม ${c.total} แถว</li>`).join("")+
              `</ul></div>`;
          }
          h+=`<div class="tscroll"><table><thead><tr><th>${esc(r.groupCol)}</th><th>จำนวน</th><th>% ของทั้งหมด</th><th>ตัวอย่าง</th></tr></thead><tbody>`;
          // share of the file, not just the raw count: on a 200-row file the counts read 186/6/5/3 and
          // nothing on screen said that the first group is 93% of everything
          const share={}; groupAggregate(rows,r.groupCol,null).groups.forEach(g=>share[g.name]=g.pct);
          r.groups.forEach(g=>{h+=`<tr><td style="font-weight:600">${esc(g.name)}</td><td>${g.count}</td><td>${fmtNum(share[g.name])}%</td><td>${g.sample.map(recordCellHtml).join("")}${g.count>g.sample.length?`<div style="color:var(--muted);font-size:12px">และอีก ${g.count-g.sample.length} แถว</div>`:""}</td></tr>`;});
          const anyCapped = r.groups.some(g => g.count > g.sample.length);

          // Totals per group, as a second table rather than more columns on the first: the group that

              agg.groups.map(g=>`<tr><td style="font-weight:600">${esc(g.name)}</td><td>${g.numCount}</td><td>${fmtNum(g.sum)}</td><td>${fmtNum(g.avg)}</td></tr>`).join("")+

          listTimeColumns(cols,rows).filter(c=>!rowsFollowTime(rows,c)).slice(0,1).forEach(c=>{

          h+=`<div style="margin-bottom:14px"><div style="font-size:13px;color:var(--muted);margin-bottom:4px">${esc(fileLabel(f))}</div>`;
          if(!r){ h+=renderStructuredFallback([f],"ไฟล์นี้ไม่มีคอลัมน์ตัวเลขที่เหมาะกับการพยากรณ์ หรือมีข้อมูลน้อยเกินไป (ต้องการอย่างน้อย 4 แถว)")+`</div>`; return; }
          // No date-shaped column at all: the rows are items, not periods, and halving them in file order
          // compares whichever items landed in each half. On a one-row-per-machine file that printed
          // "เพิ่มขึ้น 12%" under a forecast cone. So no halves, no %, no chart — say why, and keep the
          // spread, which is a fact about the file whatever its order.
          if(!listTimeColumns(cols,rows).length){
            const fromListPrompt = !!fc && fc!=="forecast";
            h+=`<div class="box box-amber" style="font-size:13px"><b>ไฟล์นี้ไม่มีคอลัมน์วันที่หรือช่วงเวลา จึงดูแนวโน้มไม่ได้</b>`+
              `<div style="margin-top:4px">การดูแนวโน้มต้องใช้ค่าเดียวกันที่วัดซ้ำตามเวลา เช่น 1 แถวต่อ 1 เดือน — ในไฟล์นี้ลำดับแถวไม่ใช่ลำดับเวลา`+
              (fromListPrompt?`<br>ไฟล์นี้สร้างจาก Prompt แบบ${esc(CAT_PICKER_LABEL[fc]||fc)} ซึ่งขอข้อมูลเป็นรายการ ไม่ได้ขอข้อมูลตามเวลา`:``)+
              `<br>รูปแบบวันที่ที่อ่านได้: <code>2025-01</code> · <code>2025-01-15</code> · <code>15/01/2025</code> · <code>2025</code></div></div>`+
              spreadBlock(columnNumbers(rows,r.col),r.col,0)+`</div>`;
            return;
          }
          const dir = r.pct===null ? "" : (r.pct>=0?"เพิ่มขึ้น":"ลดลง");
          h+=`<div class="metric-row"><div class="metric"><div class="n">${r.firstAvg.toFixed(1)}</div><div class="l">เฉลี่ยครึ่งแรก (${esc(r.col)})</div></div>
            <div class="metric"><div class="n">${r.secondAvg.toFixed(1)}</div><div class="l">เฉลี่ยครึ่งหลัง</div></div></div>`;
          h+=r.pct===null
            ? `<div class="prose">คำนวณ % การเปลี่ยนแปลงไม่ได้ (ค่าเฉลี่ยครึ่งแรกเป็น 0) — ดูค่าเฉลี่ยทั้งสองช่วงด้านบนแทน</div>`
            : `<div class="prose">แนวโน้ม${dir} ${Math.abs(r.pct)}% เทียบครึ่งแรกกับครึ่งหลังของข้อมูลที่อัปโหลด โดยแบ่งตามลำดับแถวในไฟล์ — ถ้าไฟล์ไม่ได้เรียงตามช่วงเวลา ตัวเลขนี้จะไม่สะท้อนแนวโน้มตามเวลา</div>`;
          // the two half-averages alone cannot say whether their gap is large for this column; the
          // spread puts them next to the range the values actually cover. No share here — the top
          // rows of a time series are not a meaningful slice of it.
          h+=seriesChart(r.series,r.col);
          h+=spreadBlock(columnNumbers(rows,r.col),r.col,0);
          h+=`</div>`;
        });
        if(skipped.length) h+=`<div class="box box-gray" style="margin-top:8px;font-size:13px">ข้ามไฟล์ที่ไม่ใช่ CSV: ${skipped.map(f=>esc(fileLabel(f))).join(", ")} — การพยากรณ์แนวโน้มต้องใช้ไฟล์ตาราง</div>`;
      }
    } else {
      h+=sampleShape("forecast");
    }
  }
  else if(cat==="generate"){
    h+=`<h3>สร้างเนื้อหา — โครงเอกสาร</h3>`;
    const rows=computeGenerateSkeleton(window._ucCtx.biz);
    h+=`<table><tbody>`+rows.map(r=>`<tr><td style="font-weight:600;width:35%">${esc(r.label)}</td><td${r.real?"":` style="color:var(--faint);font-style:italic"`}>${esc(r.value)}</td></tr>`).join("")+`</tbody></table>`;
    h+=`<div class="box box-gray" style="margin-top:10px">ตัวอย่างนี้ประกอบจาก field จริงของ Use Case นี้ ส่วนเนื้อหาที่ต้องแต่งขึ้นจริง (แถวสุดท้าย) เป็นส่วนที่ต้อง implement ร่วมกับที่ปรึกษา — ดูการ์ดสถานะข้อมูลในส่วนที่ 1 ด้านบนสำหรับสิ่งที่ต้องเตรียม</div>`;
  }
  else {
    // unknown category (AI task type not recognized) — input contract + CTA, no dedicated renderer planned
    h+=`<h3>${CAT_LABEL[cat]} — โครงข้อมูลที่ต้องใช้ (Input Contract)</h3>
      <div class="box box-gray">ไม่สามารถระบุประเภทงาน AI ได้จากคำอธิบาย (aiTaskType) — เวอร์ชันนี้แสดงข้อมูลนำเข้าที่จำเป็นและรูปแบบผลลัพธ์ที่คาดหวังแทน เพื่อให้ที่ปรึกษาช่วยออกแบบ workflow ที่เหมาะสมต่อไป</div>`;
    if(datasets.length){
      h+=`<table style="margin-top:10px"><thead><tr><th>แหล่งข้อมูลที่ต้องใช้</th><th>สถานะ</th><th>ที่มา</th></tr></thead><tbody>`;
      datasets.forEach(ds=>{const c=(ds.condition||"").toLowerCase();const cl=COND[c]||["—","pill-neu"];
        h+=`<tr><td>${esc(ds.name)}</td><td><span class="pill ${cl[1]}">${cl[0]}</span></td><td style="color:var(--muted)">${esc(LOC[ds.location]||ds.locationOther||"—")}</td></tr>`;});
      h+=`</tbody></table>`;
    }
    h+=`<div class="box box-blue" style="margin-top:12px"><b>รูปแบบผลลัพธ์ที่คาดหวัง:</b> ${esc((window._ucCtx.biz.expectedBenefit)||"—")}</div>`;
  }

  // (A sample's "ค่าจริงมาเมื่ออัปโหลดไฟล์" used to be rewritten here for generate/unknown UCs, which had
  // no upload box while showing another format's sample. The upload box and Prompt now follow the
  // chosen format, so every sample that promises an upload has one on the page.)
  out.innerHTML=h;

function doSearch(){
  const q=document.getElementById("q").value;
  const files=window._files||[];
  const res=document.getElementById("qres");
  // the file preview is for before the first search; results take its place
  const hint=document.getElementById("qhint"); if(hint && hint.style) hint.style.display="none";
  if(!files.length){res.innerHTML=`<div class="sample-note">ยังไม่ได้อัปโหลดไฟล์ — อัปโหลดก่อนจึงจะค้นได้</div>`;return;}
  const r=searchIndex(q,files);
  if(!r.total){res.innerHTML=`<div class="box box-gray">ไม่พบข้อความที่ตรงกับ “${esc(q)}” ใน ${r.units} ${searchUnitWord(files)}</div>`;return;}
  res.innerHTML=searchSummary(r.total,r.units,Math.min(SEARCH_SHOW,r.total),searchUnitWord(files))+
    r.hits.slice(0,SEARCH_SHOW).map(hh=>`<div class="passage">${hh.html}<div class="src">แหล่ง: ${esc(hh.src)} · ตรงกับ: ${hh.matched.map((m,i)=>esc(m)+(hh.partial[i]?" (บางส่วน)":"")).join(", ")}</div></div>`).join("");
}
// "ย่อหน้า" for text, "แถว" for CSV, both when the upload mixes them — the unit the count is made of
function searchUnitWord(files){
  const c=(files||[]).some(f=>f.isCSV), t=(files||[]).some(f=>!f.isCSV);
  return c&&t ? "ย่อหน้า/แถว" : c ? "แถว" : "ย่อหน้า";
}
// Shared by the real result and the sample, so the sample cannot promise a different line
function searchSummary(total,units,shown,word){
  return `<div style="font-size:13px;color:var(--muted);margin-bottom:6px">พบ <b>${total}</b> จาก ${units} ${word} ที่มีคำค้นอย่างน้อยบางส่วน` +
    (shown<total?` · แสดง ${shown} อันดับแรก`:``)+` (เรียงตามความตรง · rule-based ไม่ผ่าน AI)</div>`;
}

/* ============ CHATBOT PROMPT — category-aware .md the user runs in their own external AI chatbot ============ */
// Each ask must match exactly what the matching renderer (reconcile/summarizeFile/computeExtract*/
// computeClassify/computeRecommend/computeForecast) can consume — see task brief table.
// NOTE: "generate" is deliberately absent. Its renderer (renderOutput()'s generate branch, ~line 765)
// calls computeGenerateSkeleton(window._ucCtx.biz) only — it never reads an uploaded file, so a
// round-trip prompt/upload would be a no-op, and computeGenerateSkeleton() (~line 615) intentionally
// refuses to show simulated prose ("ไม่แสดงเนื้อหาจำลองเพื่อไม่ fabricate"). Do not re-add this entry —
// that would promise a round trip the renderer can't honor and would fabricate content by design.
// What each category's renderers can actually consume. PROMPT_ASK below says the same thing to a
// chatbot in prose; this says it to the upload UI in fields. They must not disagree, so [P5-3] locks
// this table against checkMockPrecondition()'s real behaviour rather than trusting the two to stay
// in step by hand. generate/unknown are absent on purpose (Ruling R7): their renderers never read

// Business Opportunity, the same formula as the consultant's T5 TechFeasibility Engine V1.6 oppScore()
// (itself a mirror of TeamCanvas tool 1), so a UC sits here exactly where the consultant's own matrix put
// it. The JSON carries only the formula's inputs — the W2 pain's importance/satisfaction/frequency —
// never the score. Returns null where T5 returns 0: a file that has not scored its pains yet must read
// "no score yet", not "no value".
function oppScore(sp){
  if(!sp || sp.importance==null || sp.satisfaction==null || sp.frequency==null) return null;
  const imp=+sp.importance, sat=+sp.satisfaction, freq=+sp.frequency;
  if(!isFinite(imp) || !isFinite(sat) || !isFinite(freq)) return null;
  return Math.round((imp+Math.max(imp-sat,0))*(1+(freq-5)*0.1));
}
// T5's fixed axes and its quadrant lines at their midpoints
const OPP_MAX=30, OPP_MID=15, FEAS_MAX=10, FEAS_MID=5;
// the four tracks as T5 names them; the track itself is read from the file (the consultant may override
// T5's suggestion), never recomputed here
const TRACK_INFO={A:["Quick Win","คุณค่าสูง · ทำได้ง่ายกว่า"],B:["Needs Proof","คุณค่าสูง · ทำยากกว่า"],
  C:["Strategic","คุณค่าต่ำกว่า · ทำได้ง่ายกว่า"],D:["Park","คุณค่าต่ำกว่า · ทำยากกว่า"]};
const TRACK_ORDER=["A","B","C","D"];
function trackLabel(t){ return TRACK_INFO[t] ? t+" · "+TRACK_INFO[t][0] : null; }

// One flat row per UC across every readable file. Pure (loaded[] in, rows out) so the tests and the
// export read the same numbers the screen shows. A field the file does not have yet stays null — a file
// saved at W3 has no guardrail and may have no consultant score, and a 0 would say something false.
function portfolioRows(loaded){
  const rows=[];
  (loaded||[]).forEach((f,fi)=>{
    if(!f || f.err || !f.data) return;
    const d=f.data, m=d.meta||{};
    const pains=((d.w2_critique||{}).painSpots)||[];
    ucListFrom(d).forEach((u,ui)=>{
      const b=u.business||{}, ti=u.techInput||{}, cf=u.coachFeasibility||{};
      const g=(u.w5_toBe||{}).guardrails||{};
      const sp=pains.find(p=>p && p.id===b.painAddressed)||null;
      const ds=(Array.isArray(ti.dataSets)?ti.dataSets:[]).filter(x=>x && typeof x==="object");
      const tt=(ti.aiTaskType||"").trim();
      const freq=sp && sp.frequency!=null && isFinite(+sp.frequency) ? +sp.frequency : null;
      rows.push({
        n:rows.length+1, fi, ui, file:f.name||null,
        team:m.teamName||null, fn:m.function||null, teamKey:m.teamName||m.function||f.name||("file "+(fi+1)),
        processId:m.processId||null, processName:m.processName||null,
        week:m.lastWeekCompleted==null ? null : m.lastWeekCompleted,
        title:b.title||("UC #"+(ui+1)), tt, cat:categorize(tt),
        feas:typeof cf.feasibilityScore==="number" ? cf.feasibilityScore : null,
        opp:oppScore(sp), freq, pain:sp ? (sp.shortName||sp.pain||null) : null,
        track:TRACK_INFO[cf.track] ? cf.track : null,
        rank:typeof u.w4_finalRank==="number" ? u.w4_finalRank : null,
        datasets:ds.map(x=>({condition:(x.condition||"").toLowerCase()||null, location:x.location||null})),
        sysKey:ti.systemsToIntegrate||null, systems:systemsLabel(ti),
        hil:HIL[g.humanInLoop] ? g.humanInLoop : null,
        // the TeamCanvas box "ไม่แน่ใจข้อมูลเทคนิคข้างต้น — ขอให้ทีมที่ปรึกษาช่วยตรวจ"
        flagged:Array.isArray(ti.uncertainFlags) && ti.uncertainFlags.length>0,
        // T5's "จุดที่ควรเช็คของจริง": questions the AI first pass in T5 could not answer from the team's
        // inputs and left for the consultant to check against the real systems — the AI wrote them, not
        // the consultant, and the screen must say so
        verify:(Array.isArray(cf.claudeVerifyFlags)?cf.claudeVerifyFlags:[]).map(v=>String(v==null?"":v).trim()).filter(Boolean),
        wardley:(Array.isArray(cf.wardley)?cf.wardley:[]).map(w=>w && (w.decision||w.decisionKey)).filter(Boolean)
      });
    });
  });
  return rows;
}
function countBy(list){ const o={}; list.forEach(k=>{ if(k!=null && k!=="") o[k]=(o[k]||0)+1; }); return o; }
function portfolioSummary(rows, loaded){
  const good=(loaded||[]).filter(f=>f && !f.err && f.data);
  const ds=[].concat(...rows.map(r=>r.datasets));
  return {
    teams:new Set(good.map((f,i)=>{const m=f.data.meta||{}; return m.teamName||m.function||f.name||("file "+i);})).size,
    files:good.length, ucs:rows.length,
    dsTotal:ds.length, dsReady:ds.filter(x=>x.condition==="ready").length,
    flagged:rows.filter(r=>r.flagged).length,
    hilKnown:rows.filter(r=>r.hil).length, hilHigh:rows.filter(r=>r.hil==="high").length,
    plotted:rows.filter(r=>r.feas!=null && r.opp!=null).length,
    noFeas:rows.filter(r=>r.feas==null).length, noOpp:rows.filter(r=>r.opp==null).length,
    verify:rows.reduce((a,r)=>a+r.verify.length,0), verifyUCs:rows.filter(r=>r.verify.length).length,
    byTrack:countBy(rows.map(r=>r.track)), byCat:countBy(rows.map(r=>r.cat)),
    byCondition:countBy(ds.map(x=>x.condition)), byLocation:countBy(ds.map(x=>x.location)),
    bySystem:countBy(rows.map(r=>r.sysKey)), byWardley:countBy([].concat(...rows.map(r=>r.wardley))),
    byHil:countBy(rows.map(r=>r.hil))
  };
}
function filterPfRows(rows, o){
  const q=((o||{}).q||"").trim().toLowerCase(), op=o||{};
  return rows.filter(r=>
    (!q || [r.team,r.fn,r.processName,r.title,r.file].some(v=>String(v||"").toLowerCase().includes(q))) &&
    (!op.cat || r.cat===op.cat) && (!op.track || r.track===op.track) && (!op.flagged || r.flagged) &&
    (!op.only || op.only.indexOf(r.n)!==-1));
}
// empty values sort last in both directions, so "highest first" never opens on a column of dashes
function sortPfRows(rows, key, dir){
  const d=dir<0?-1:1, val=r=>key==="team" ? (r.team||r.fn||r.file||"") : r[key];
  return rows.slice().sort((a,b)=>{
    const x=val(a), y=val(b);
    if(x==null || x==="") return (y==null || y==="") ? a.n-b.n : 1;
    if(y==null || y==="") return -1;
    const c=(typeof x==="number" && typeof y==="number") ? x-y : String(x).localeCompare(String(y),"th");
    return c ? c*d : a.n-b.n;
  });
}

function pfTiles(s){

    [s.hilKnown ? s.hilHigh : "—", "UC ที่ต้องมีคนตรวจระดับสูง", s.hilKnown===s.ucs ? "Guardrail (W5)" : "มีข้อมูล Guardrail "+s.hilKnown+"/"+s.ucs+" UC"]
  ];
  return `<div class="pf-tiles">${T.map(t=>`<div class="pf-tile"><div class="n">${t[0]}</div><div class="l">${t[1]}</div>${t[2]?`<div class="s">${esc(t[2])}</div>`:""}</div>`).join("")}</div>`;
}
// Bubble chart after T5's own Prioritization Matrix: same axes, same quadrant lines and names, dot size
// from the pain's frequency. UCs with identical scores share one dot with their count in it, and a click
// filters the table — 69 names cannot be printed on the chart, and a tooltip alone fails on a phone.
function renderPrioMatrix(rows){
  const pts=rows.filter(r=>r.feas!=null && r.opp!=null);
  if(!pts.length) return `<div class="box box-gray">ยังไม่มี UC ที่มีทั้งคะแนน Feasibility จากที่ปรึกษาและคะแนนของ pain ครบ จึงยังวาดกราฟไม่ได้</div>`;
  const W=640, H=420, L=52, R=16, T=16, B=50;
  const cl=(v,max)=>Math.max(0,Math.min(max,v));
  const sx=v=>L+cl(v,FEAS_MAX)/FEAS_MAX*(W-L-R), sy=v=>H-B-cl(v,OPP_MAX)/OPP_MAX*(H-T-B);
  const mx=sx(FEAS_MID), my=sy(OPP_MID);
  const groups={};
  pts.forEach(r=>{ const k=r.feas+"|"+r.opp; (groups[k]=groups[k]||{x:r.feas,y:r.opp,rs:[]}).rs.push(r); });
  let s=`<svg class="pf-mx" viewBox="0 0 ${W} ${H}" role="img" aria-label="Prioritization Matrix: Feasibility กับ Business Opportunity">`;
  s+=`<rect x="${mx}" y="${T}" width="${W-R-mx}" height="${my-T}" class="qA"/><rect x="${L}" y="${T}" width="${mx-L}" height="${my-T}" class="qB"/>`;
  s+=`<rect x="${mx}" y="${my}" width="${W-R-mx}" height="${H-B-my}" class="qC"/><rect x="${L}" y="${my}" width="${mx-L}" height="${H-B-my}" class="qD"/>`;
  for(let v=0;v<=FEAS_MAX;v++) s+=`<line x1="${sx(v)}" y1="${T}" x2="${sx(v)}" y2="${H-B}" class="grid"/><text x="${sx(v)}" y="${H-B+16}" class="tick" text-anchor="middle">${v}</text>`;
  for(let v=0;v<=OPP_MAX;v+=5) s+=`<line x1="${L}" y1="${sy(v)}" x2="${W-R}" y2="${sy(v)}" class="grid"/><text x="${L-8}" y="${sy(v)+4}" class="tick" text-anchor="end">${v}</text>`;
  s+=`<line x1="${mx}" y1="${T}" x2="${mx}" y2="${H-B}" class="mid"/><line x1="${L}" y1="${my}" x2="${W-R}" y2="${my}" class="mid"/>`;
  const ql=(t,x,y,a)=>`<text x="${x}" y="${y}" text-anchor="${a}" class="ql t${t}">${esc(trackLabel(t))}</text>`;
  s+=ql("A",W-R-8,T+16,"end")+ql("B",L+8,T+16,"start")+ql("C",W-R-8,H-B-8,"end")+ql("D",L+8,H-B-8,"start");
  s+=`<text x="${(L+W-R)/2}" y="${H-10}" class="ax" text-anchor="middle">Feasibility ความเป็นไปได้ทางเทคนิค (สูง = ทำง่าย) →</text>`;
  s+=`<text transform="translate(14 ${(T+H-B)/2}) rotate(-90)" class="ax" text-anchor="middle">Business Opportunity คุณค่าธุรกิจ →</text>`;
  const fmax=g=>Math.max(...g.rs.map(r=>r.freq==null?5:r.freq));
  // big dots first, so a small one is never buried under a large one
  Object.values(groups).sort((a,b)=>fmax(b)-fmax(a)).forEach(g=>{
    const rad=4+Math.max(1,Math.min(10,fmax(g)))*0.95;
    const t=g.rs[0].track;
    const tip=(g.rs.length>1?g.rs.length+" UC · ":"")+"Feasibility "+g.x+" · Opportunity "+g.y+"\n"+
      g.rs.map(r=>"#"+r.n+" "+r.title+" ("+(r.team||r.fn||r.file)+")"+(r.freq!=null?" · ความถี่ "+r.freq:"")).join("\n");
    s+=`<g class="pf-dot" data-ns="${g.rs.map(r=>r.n).join(",")}" tabindex="0" role="button" onclick="pfPick(this)" onkeydown="if(event.key==='Enter')pfPick(this)"><title>${esc(tip)}</title>`+
      `<circle cx="${sx(g.x)}" cy="${sy(g.y)}" r="${rad+5}" class="hit"/><circle cx="${sx(g.x)}" cy="${sy(g.y)}" r="${rad}" class="m t${t||"X"}"/>`+
      (g.rs.length>1?`<text x="${sx(g.x)}" y="${sy(g.y)+4}" text-anchor="middle" class="c">${g.rs.length}</text>`:"")+`</g>`;
  });
  s+=`</svg>`;
  return s;
}
function pfMatrixNotes(rows, s){
  const leg=TRACK_ORDER.map(t=>`<span><i class="t${t}"></i>${esc(trackLabel(t))} <b>${s.byTrack[t]||0}</b></span>`).join("");
  const miss=s.ucs-s.plotted;
  const why=[s.noFeas?s.noFeas+" UC ที่ปรึกษายังไม่ให้คะแนน Feasibility":"", s.noOpp?s.noOpp+" UC ที่ pain ยังไม่มีคะแนนครบ (สำคัญ/พอใจ/ถี่)":""].filter(Boolean).join(" · ");
  return `<div class="pf-leg">${leg}<span class="sz">ขนาดวง = ความถี่ของ pain · ตัวเลขในวง = จำนวน UC ที่คะแนนเท่ากัน</span></div>`+
    (miss?`<div class="pf-note">อยู่บนกราฟ ${s.plotted}/${s.ucs} UC — ${esc(why)}</div>`:"")+
    `<div class="pf-note">Opportunity = (สำคัญ + max(สำคัญ − พอใจ, 0)) × (1 + (ความถี่ − 5) × 0.1) จาก pain ใน W2 — สูตรเดียวกับ T5 · Track ตามที่ที่ปรึกษาบันทึกในไฟล์ · ชี้วงเพื่อดูชื่อ · <b>กดวงเพื่อกรองตาราง</b></div>`;
}
// the same four quadrants as lists, so every UC name can be read without hovering
function renderPrioBoxes(rows){
  const SHOW=8;
  const item=r=>`<div class="qi"><span class="qv">${r.feas==null?"—":r.feas}</span><span class="qt">${esc(r.title)}</span><span class="qm">${esc(r.team||r.fn||r.file||"")}</span></div>`;
  const cell=t=>{
    const rs=rows.filter(r=>r.track===t).sort((a,b)=>(b.feas==null?-1:b.feas)-(a.feas==null?-1:a.feas)||a.n-b.n);
    return `<div class="qc q${t}"><div class="qh pf-dot" data-ns="${rs.map(r=>r.n).join(",")}" tabindex="0" role="button" onclick="pfPick(this)" onkeydown="if(event.key==='Enter')pfPick(this)" title="กดเพื่อกรองตาราง">`+
      `<span class="qn t${t}">${esc(trackLabel(t))}</span><span class="qk">${rs.length} UC</span></div><div class="qd">${TRACK_INFO[t][1]}</div>`+
      (rs.length?rs.slice(0,SHOW).map(item).join(""):`<div class="qd">ไม่มี UC</div>`)+
      (rs.length>SHOW?`<details><summary>+ อีก ${rs.length-SHOW} UC</summary>${rs.slice(SHOW).map(item).join("")}</details>`:"")+`</div>`;
  };
  const none=rows.filter(r=>!r.track).length;
  return `<div class="pf-q"><div class="qy">Business Opportunity ↑</div><div class="qg">${cell("B")}${cell("A")}${cell("D")}${cell("C")}</div><div class="qx">Feasibility →</div></div>`+
    `<div class="pf-note">ตัวเลขหน้าชื่อ = คะแนน Feasibility · เรียงจากทำได้ง่ายสุด${none?` · ${none} UC ยังไม่ได้จัด Track`:""}</div>`;
}
function pfBars(title, obj, label, note){
  const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0])));
  if(!e.length) return `<div class="pf-bars"><div class="bt">${title}</div><div class="pf-note">ยังไม่มีในไฟล์ชุดนี้</div></div>`;
  const max=e[0][1], tot=e.reduce((a,x)=>a+x[1],0);
  return `<div class="pf-bars"><div class="bt">${title}</div>`+e.map(([k,v])=>{const l=label?label(k):k;
    return `<div class="br" title="${esc(l)}: ${v} (${Math.round(v/tot*100)}%)"><span class="bl">${esc(l)}</span><span class="bb"><i style="width:${(v/max*100).toFixed(1)}%"></i></span><span class="bv">${v}</span></div>`;}).join("")+
    (note?`<div class="pf-note">${note}</div>`:"")+`</div>`;
}

function loadPortfolio(e){
  const files=[...e.target.files]; if(!files.length) return;
  const jobs=files.map(f=>new Promise(res=>{const r=new FileReader();r.onload=ev=>{try{res({name:f.name,data:JSON.parse(ev.target.result)})}catch(err){res({name:f.name,err:String(err.message||err)})}};r.readAsText(f)}));
  Promise.all(jobs).then(renderPortfolio);
}

  h+=`<div class="card" id="portTable"><h3>Use Case ทั้งหมด</h3>
    <div class="pf-filter">
      <input type="text" id="portSearch" placeholder="ค้นชื่อทีม / กระบวนการ / Use Case…" oninput="filterPortfolio()">
      <select id="portCat" onchange="filterPortfolio()"><option value="">ทุกหมวดงาน AI</option>${cats.map(c=>`<option value="${esc(c)}">${esc(CAT_LABEL[c]||c)}</option>`).join("")}</select>
      <select id="portTrack" onchange="filterPortfolio()"><option value="">ทุก Track</option>${TRACK_ORDER.map(t=>`<option value="${t}">${esc(trackLabel(t))}</option>`).join("")}</select>
      <label class="chk"><input type="checkbox" id="portFlag" onchange="filterPortfolio()"> เฉพาะที่ทีมขอให้ตรวจ</label>
      <span class="pf-count" id="portCount"></span><button class="pf-clear" id="portClear" onclick="pfPick(null)" style="display:none">ล้างตัวกรองจากกราฟ ✕</button>
    </div>
    <div class="tscroll"><table class="pf-tb"><thead><tr>${PF_COLS.map(c=>`<th class="${c[2]?"num":""}${PF_SORTABLE[c[0]]?" sortable":""}"${PF_SORTABLE[c[0]]?` onclick="pfSort('${c[0]}')"`:""}>${c[1]}</th>`).join("")}</tr></thead>
    <tbody id="portRows"></tbody></table></div>
    <div class="pf-note">กดชื่อ Use Case เพื่อเปิดในโหมด Use Case เดี่ยว · กดหัวคอลัมน์เพื่อเรียง</div></div>`;
  // folded by default: the summary line already says how many there are and where they came from
  h+=`<details class="card pf-fold" id="portVerify"><summary><span class="ft">จุดที่ควรเช็คของจริงก่อนเริ่ม</span>`+
    `<span class="fs">${s.verify?`${s.verify} ประเด็นใน ${s.verifyUCs} UC — จากคำแนะนำเบื้องต้นของ AI ใน T5 · ที่ปรึกษาจะตรวจกับของจริงให้`:"ยังไม่มีในไฟล์ชุดนี้"}</span></summary>`+
    `<div class="pf-fold-body">${renderPfVerify(PF_ROWS,s)}</div></details>`;
  h+=`<div class="exportbar"><button class="accent" onclick="exportPortfolioJSON()">Export .json</button><button onclick="exportPortfolioPDF()">PDF</button></div>`;
  document.getElementById("main").innerHTML=h;
  filterPortfolio();
}
// Only ever rewrites the table body and its counter — never #main, so the search box keeps its focus
// and caret while the user types.
function filterPortfolio(){
  const val=id=>(document.getElementById(id)||{}).value||"";
  const opts={q:val("portSearch"), cat:val("portCat"), track:val("portTrack"), flagged:!!(document.getElementById("portFlag")||{}).checked, only:PF_ONLY};
  const shown=sortPfRows(filterPfRows(PF_ROWS,opts), PF_SORT.k, PF_SORT.d);
  const body=document.getElementById("portRows"); if(!body) return;
  body.innerHTML=shown.length ? shown.map(renderPfRow).join("") : `<tr><td colspan="${PF_COLS.length}" class="empty">ไม่พบ Use Case ที่ตรงกับตัวกรอง</td></tr>`;
  const c=document.getElementById("portCount"); if(c) c.textContent="แสดง "+shown.length+" จาก "+PF_ROWS.length+" UC";
  const cl=document.getElementById("portClear"); if(cl && cl.style) cl.style.display=PF_ONLY?"":"none";
}
function pfSort(k){ PF_SORT = PF_SORT.k===k ? {k, d:-PF_SORT.d} : {k, d:(k==="feas"||k==="opp")?-1:1}; filterPortfolio(); }
// a dot or a quadrant narrows the table to its UCs; the same one again (or the clear button) undoes it
function pfPick(el){
  const ns=el && el.getAttribute ? el.getAttribute("data-ns") : null;
  const same=ns!=null && PF_ONLY && PF_ONLY.join(",")===ns;
  PF_ONLY=(ns==null || same) ? null : (ns ? ns.split(",").map(Number) : []);
  [...document.querySelectorAll(".pf-dot")].forEach(d=>d.classList.toggle("sel", !!PF_ONLY && d===el));
  filterPortfolio();
  const t=document.getElementById("portTable");
  if(PF_ONLY && t && t.scrollIntoView) t.scrollIntoView({behavior:"smooth",block:"start"});
}
function pfSub(btn,key){
  const card=btn.closest(".card"); if(!card) return;
  card.querySelectorAll(".pf-tabs button").forEach(b=>b.classList.toggle("on",b===btn));
  card.querySelectorAll(".pf-sub").forEach(p=>p.style.display=p.getAttribute("data-s")===key?"":"none");
}
// Opens the UC in the single-UC view from the file already loaded here — the same state loadJSON()
// builds, so everything downstream (file check, picker, render) cannot tell the difference.
function pfOpen(n){
  const r=PF_ROWS.find(x=>x.n===n), f=r && PORT_LOADED && PORT_LOADED[r.fi];
  if(!f || !f.data) return;
  DATA=f.data; SINGLE_FILE_NAME=f.name; META=DATA.meta||{}; UC_LIST=ucListFrom(DATA); SEL=r.ui;
  setMode("single");
  if(typeof window.scrollTo==="function") window.scrollTo(0,0);
}
// The export record. Pure, like buildExport(): every UC in the loaded files, not only the filtered view.
function buildPortfolioExport(rows, s, loaded, now){
  const good=(loaded||[]).filter(f=>f && !f.err && f.data);
  return {
    tool:"TeamCanvas UC Playground", version:VERSION, kind:"portfolio", exportedAt:(now||new Date()).toISOString(),
    files:good.map(f=>{const m=f.data.meta||{}; return {file:f.name||null, schemaVersion:f.data.schemaVersion||null, teamName:m.teamName||null,
      function:m.function||null, processId:m.processId||null, processName:m.processName||null, lastWeekCompleted:m.lastWeekCompleted==null?null:m.lastWeekCompleted};}),
    unreadableFiles:(loaded||[]).filter(f=>f && f.err).map(f=>f.name),
    summary:{ teams:s.teams, files:s.files, useCases:s.ucs, dataSets:{total:s.dsTotal, ready:s.dsReady},
      teamFlaggedUncertain:s.flagged, humanInLoop:{high:s.hilHigh, known:s.hilKnown}, onMatrix:s.plotted,
      byTrack:s.byTrack, byCategory:s.byCat },
    aiVerifyFlagsSource:"coachFeasibility.claudeVerifyFlags — questions from the AI first pass in T5, left for the consultant to check; not the consultant's findings",
    opportunityFormula:"(importance + max(importance - satisfaction, 0)) x (1 + (frequency - 5) x 0.1) — T5 TechFeasibility Engine V1.6",
    useCases:rows.map(r=>({ no:r.n, file:r.file, teamName:r.team, function:r.fn, processId:r.processId, processName:r.processName,
      title:r.title, aiTaskType:r.tt||null, category:r.cat, feasibility:r.feas, opportunity:r.opp, painFrequency:r.freq, pain:r.pain,
      track:r.track, teamRank:r.rank, dataSets:{ready:r.datasets.filter(x=>x.condition==="ready").length, total:r.datasets.length},
      systems:r.systems, humanInLoop:r.hil, teamFlaggedUncertain:r.flagged, aiVerifyFlags:r.verify }))
  };
}
function exportPortfolioJSON(){
  downloadJSON(buildPortfolioExport(PF_ROWS, portfolioSummary(PF_ROWS, PORT_LOADED||[]), PORT_LOADED||[]),
    "Portfolio_export.json");
}
function exportPortfolioPDF(){
  const s=portfolioSummary(PF_ROWS, PORT_LOADED||[]), head=document.getElementById("printHead");
  if(head) head.textContent=["Portfolio Review", s.teams+" ทีม · "+s.ucs+" Use Case",
    "export "+new Date().toLocaleDateString("th-TH",{year:"numeric",month:"short",day:"numeric"}), "TeamCanvas UC Playground "+VERSION].join(" · ");
  const closed=[...document.querySelectorAll("#main details:not([open])")];
  closed.forEach(d=>d.open=true);
  const restore=()=>{ closed.forEach(d=>d.open=false); window.removeEventListener("afterprint",restore); };
  window.addEventListener("afterprint",restore);
  window.print();
}

// first paint: the landing screen is rendered, not hard-coded into the markup, so it and setMode()
// can never drift apart
document.getElementById("main").innerHTML=emptyState("single");
wireDropzone();
</script>
</body>
</html>
